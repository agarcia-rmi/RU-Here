<p>Under no circumstances will GoogleGlass or any comparable device be allowed on The River at Tampa Bay Church property. Possession of such devices will result in immediate disciplinary action and the confiscation of the device.</p>
<h3>RESTROOMS</h3>
<p>Restrooms are designated for exclusive use by males or females, as defined in Section 553.865 (3), F.S.</p>
<h3>SOCIAL MEDIA</h3>
<p>Any student who is found to be posting information on any social media in a manner that brings discredit to the Kingdom of God and/or RU will be requested to remove the post, and/or be disciplined, even to the extent of suspension or expulsion from school.</p>
<h3>SPECIAL GUESTS</h3>
<p>Students are not allowed to approach, engage, exchange contact information or attempt to network with special guests here at RU, The River at Tampa Bay Church or Revival Ministries International.</p>
<h3>STUDENT MAIL</h3>
<p>Please do not list the address of RU or The River at Tampa Bay Church or Revival Ministries International as your personal address. Any student mail received in this manner will automatically be returned to the sender. The school will not notify you of any mail received.</p>
<h3>TELEPHONE CALLS</h3>
<p>This school will not accept incoming calls for any students except in extreme emergencies. Please ask people not to try to contact you by phone while you are on campus.</p>
<h3>TEXT MESSAGING</h3>
<p>Sharing information electronically with others in class by text messaging, IM, e-mail, Bluetooth, or any other means is prohibited.</p>
<p>All text and other communication apps between the opposite sexes must be in an approved ministry chat with approved RU or The River at Tampa Bay Church leadership oversight. At no time should contact information of the opposite sex be saved on your personal devices or shared with others.</p>`},

{ id:"p55", t:"Honor Pledge", n:"55", h:`
<h2 class="ph">STUDENT INFORMATION</h2>
<p>The Student Honor Pledge is listed below. Each student should read it attentively to ensure personal and complete compliance is a realistic achievement. If a student recognizes a personal inability to maintain this pledge, the student must reconsider the decision to attend RU.</p>
<h3>HONOR PLEDGE</h3>
<ul class="pledge">
<li>I pledge to apply my maximum intellectual and spiritual abilities to the Glory of God.</li>
<li>I pledge to nurture my spiritual relationship with God.</li>
<li>I pledge to develop social relationships and show love towards others equivalent to the love I have for myself.</li>
<li>I will not lie, steal, use profanity, or engage in tale-bearing.</li>
<li>I will not cheat or plagiarize. I will accomplish my academic requirements on my own merit and will not complete assignments by improperly collaborating with other students.</li>
<li>I pledge to abstain from any and all immoral and illegal activities; both on and off campus.</li>
<li>I will not take myself out or anyone with me because of the dating rule.</li>
<li>I will refrain from the use, endorsement, or propagation of illegal drugs, abusive activity, immoral behavior, illicit sexual acts, homosexual behavior, pornography, e-cigarettes or vaping, marijuana in any form, and the use of tobacco. I will not drink any kind of alcoholic beverage.</li>
<li>I will abide by all rules and regulations, verbal or otherwise, as outlined in the Student Handbook.</li>
<li>I pledge to seek God&rsquo;s will for my life and to be obedient to His call.</li>
<li>I pledge to attend regular church services where God is exalted and to maintain membership requirements at my church.</li>
<li>I pledge to attend class promptly and to participate in any outside assignments.</li>
<li>I pledge to abide by all rules and regulations of the RU.</li>
<li>I pledge to do my best and seek help and counsel from RU leadership immediately if I find myself struggling with any of the above mentioned and submit to the counsel given.</li>
<li>I realize that the school is a private entity and I have no rights as it pertains to the governing of the college. I accept my attendance as a privilege and further understand that RU may exercise its right to withdraw a student from a course or program for disciplinary reasons at any time.</li>
</ul>
<p>I will carefully and prayerfully uphold the Honor Code. I understand that my signature on the Signature Page of this Handbook signifies my acceptance of the Honor Code in its entirety and will serve as a prerequisite for enrollment in this institute.</p>`},
{ id:"p56", t:"Welcome &mdash; River Bible Institute", n:"56", cls:"welcome", h:`
<h2 class="ph">WELCOME FROM THE FOUNDERS AND PRESIDENTS OF<br>THE RIVER BIBLE INSTITUTE</h2>
<p>It has been our dream for many years to provide a place where men and women of all ages, backgrounds and experiences could gather together to study and experience the glory of God. As you will discover, the River Bible Institute is not a traditional Bible school. It is a Holy Ghost training center, birthed specifically for those whose strongest desire is to know Christ and to make Him known.</p>
<p>You can be saturated in the Word and Spirit of God at the River Bible Institute. It is the place where you will be empowered to reach your high calling and set your world on fire with revival. Don&rsquo;t Wait! God wants to raise you up to do great things for Him. We look forward to seeing you grow and change and then go out into the world in power and victory.</p>
<p class="sig">Yours for Revival and the Harvest,</p>
<div class="sigs">
  <div><b>Dr. Rodney Howard-Browne</b><span>Th.D., D.Min., D.D.</span><span>President</span></div>
  <div><b>Dr. Adonica Howard-Browne</b><span>D.Min., M.A., B.A.</span><span>Vice President</span></div>
</div>
<h3>REMARKS FROM THE DEAN OF THE RIVER BIBLE INSTITUTE</h3>
<p>God is truly raising-up a New Breed of Revivalists in this land and in this 21st century; a breed that defies religion, but loves relationship. Jesus did not lay down His life for religion; He laid it down for Relationship. My friend, as you are deciding on whether to come to RU, I want you to ask yourself these questions; Am I tired of religion? Am I tired of church as status quo? Do I want to be a part of history, or do I want to be a part of Making History? Do I want to read about the ones who made History, or do I want to be one that is read about because of Making History?</p>
<p>Drs. Rodney and Adonica Howard-Browne were called by God to come to America in 1987 to see America shaken with the fires of revival. We have seen smatterings of that revival, but the best is yet to come, my friend. Here&rsquo;s the awesome part, they can&rsquo;t do it alone, and they NEED YOU! Do you want to see a Great Awakening in this land? Faith without works is dead! Come to RU, and get trained up to become one of these 21st century revivalists that are willing to give God their ALL because He gave His ALL; JESUS!</p>
<p>Most of the world&rsquo;s preachers come out of this great land called America, yet America is crying out for the manifestation of the sons/daughters of God to rise up and take their place. Future student, truly, believe that if you make the decision now and attend a River Institute this fall, we can help you facilitate the call which is upon your life. We are dedicated to seeing you be a part of making History.</p>
<p class="sig">God Bless,</p>
<div class="sigs one">
  <div><b>Dr. Mark Cabrera</b><span>Ed.D.</span><span>Dean of the River Bible Institute</span></div>
</div>`},

{ id:"p57", t:"RBI Classes &mdash; Foundational Year", n:"57", h:`
<h2 class="ph">CLASS DESCRIPTIONS</h2>
<h3>RIVER BIBLE INSTITUTE CLASSES &ndash; Foundational Year</h3>
<p><b>The Anointing</b> &ndash; Dr. Rodney Howard-Browne reveals some key truths to the anointing learned in over 30 years of ministry. The student will learn that the anointing is present to heal, deliver, set free, and set ablaze anyone who is hungry and desperate enough to be used of God.</p>
<p><b>Authority of the Believer</b> &ndash; This course is a practical course on the subject of our authority as given by the Word of God. We will be using the book The Believer&rsquo;s Authority by Kenneth E. Hagin to begin to unfold the scriptures concerning this great subject.</p>
<p><b>Christian Foundation I</b> &ndash; This course will help the new believers and mature Christians alike learn the legal claim for who and what they are in Christ. Students will go over the basics of the Bible and build upon their knowledge of the Word in light of redemption to increase their faith and challenge each student to a deeper walk with Christ our Redeemer.</p>
<p><b>Christian Foundation II</b> &ndash; This course will help the student develop strong spiritual and biblical discernment of what a true Christian lifestyle looks like. The emphases will be on purity and holiness in life, ministry and conduct as a believer. We will study how the Gifts of the Spirit and the Fruit of the Spirit cancel the works of the flesh.</p>
<p><b>Christian Lifestyle</b> &ndash; What are the outward and inward evidences of a Christian lifestyle? When we truly practice a Christian lifestyle, the inward evidence becomes obvious. God&rsquo;s glory and power pours out upon all those around us. Those who live the Christian lifestyle live a pure and confident life on the inside and outside. In the epistles we find what is expected of us inwardly and outwardly.</p>
<p><b>English Composition</b> &ndash; This course will refresh and develop your English grammar skills and reviews the eight parts of speech, punctuation and mechanics, and foundational sentence construction. It will also develop your writing and speaking skills as it presents writing and speaking structure, style, tone, clarity, flow as well as source citations, evidence attributions, quotations and academic integrity.</p>
<p><b>Faith I</b> &ndash; An understanding of the different types of Faith that are required to enable the student to minister in a way that will not only impact their lives but most importantly, the lives of others.</p>
<p><b>Gifts of the Spirit</b> &ndash; This is a study course of the Gifts of the Spirit according to 1 Corinthians 12. The student will learn who the gifts are from, who the gifts are for, and what their purpose is according to the Bible.</p>
<p><b>Godly Character</b> &ndash; This is a course on godly character. Each student will be stirred and challenged to examine the fruit in their lives. The dynamic truths shared in this class will touch lives. When an individual knows that Christ is Lord and Savior of their life, they will know that His character and ability will work in and through them. Godly character will be established, evident, and set as the standard in their lives.</p>
<p><b>Heavenly Vision</b> &ndash; In this course, Dr. Rodney Howard-Browne reveals the foundation of heavenly vision. The students will learn that the vision that God place on the inside of them does not come from men, but by the revelation of Jesus Christ. It&rsquo;s the heavenly vision that will carry them through the days that are to come on the earth and is their anchor to the unseen.</p>
<p><b>Helps &amp; the Local Church</b> &ndash; This course will give the student a biblical understanding of the helps ministry in relation to the local church which works in conjunction with a word wide ministry.</p>
<p><b>The Holy Spirit</b> &ndash; A course on the Person and the work of the Holy Spirit. Emphasis is made on foundational truths that will radically change the students&rsquo; way of thinking. Students will discover what it is like to know the person of the Holy Spirit in a great way &ndash; to really know Him as best friend.</p>`},

{ id:"p58", t:"RBI Classes &mdash; Foundational Year", n:"58", h:`
<p><b>Introduction to Government</b> &ndash; This course will introduce the student to the proper role of government so they may successfully navigate governments' laws and policies to obtain favor no matter where in the world they are called to serve. To fulfill the call of God on your life you must understand God's commands upon Christians to be involved in and to interact with the governments of this world.</p>
<p><b>Introduction to Revival Studies</b> &ndash; In the ORU Revival and the Ablaze video series, Dr. Rodney Howard-Browne explains that real revival is not just a touch but a change. Every student needs a touch from the Master&rsquo;s hand to impact and mark their entire life and be revived and changed by the Holy Spirit. They will know it and the world will hear it in their words and see it in their action and attitude.</p>
<p><b>Matters of the Heart</b> &ndash; In this course, Dr. Adonica Howard-Browne will conduct a study on the heart of the believer and its importance in the Christian walk. The course will show how to develop one&rsquo;s heart and what it means to keep one&rsquo;s heart with all diligence.</p>
<p><b>New Testament Survey</b> &ndash; The student will obtain a general knowledge of the theme and contents of each New Testament book and gain an understanding of the meaning and significance of the historical events and messages of the New Testament.</p>
<p><b>Old Testament Survey</b> &ndash; The student will obtain a general knowledge of the theme and contents of each Old Testament book and gain an understanding of the meaning and significance of the historical events and messages of the Old Testament.</p>
<p><b>Personal Development</b> &ndash; This course prepares students to navigate the complexities of daily life as it pertains to the natural so that it does not hinder the supernatural as each student pursues the call of God on their life by teaching practical knowledge and strategies including life skills, time management, financial literacy, study skills, and more.</p>
<p><b>Prayer I</b> &ndash; This course will study what prayer is and how to get prayers answered; the purpose, the necessity, the possibilities, the power, the weapons, and the essentials of prayer.</p>
<p><b>Seeing Jesus (The Gospels)</b>: &ndash; This course offers an intimate and inspirational look at the life of Jesus. Using the text Jesus, this course will explore the Gospels as they reveal Jesus.</p>
<p><b>Soul Winning I</b> &ndash; This is a course on fulfilling the Great Commission. Each student will experience the joy of leading others to Christ and be equipped to effectively impact the world around them with the Gospel of Jesus Christ. Students will also become acquainted with follow-up methods.</p>
<p><b>Stewardship I</b> &ndash; This course will familiarize the student with many scriptures that pertain to finances and stewardship. A foundation is given for personal life as well as equipping with truths needed for preaching on stewardship and giving in ministry.</p>
<p><b>Submission &amp; Authority</b> &ndash; As God&rsquo;s Word is taught, the student will learn how submission and authority applies to daily life. During each class, chapters are covered from the book, A Tale of Three Kings, and wisdom is provided through personal experiences. This course will provide the student with a foundation for faith in personal life and equip with truths that will carry the student through ministry.</p>
<p><b>This Present Glory</b> &ndash; This course will address the current situation within the body of Christ on the subject of spiritual warfare with a central focus on the &quot;light&quot; that is the Lord, rather than the &quot;darkness&quot; that is in the world. The spiritual weapons available to Christians will be discussed in detail. Using the Word of God, a comparison will be made between current beliefs about spiritual warfare to reveal what is a fact and fiction, what spiritual warfare is and how the battle is fought.</p>
<p><b>Worship as a Lifestyle</b> &ndash; This course will give the student a thorough understanding of the foundation, purpose and practice of worship in the believer&rsquo;s life. Emphasis will be placed on worship as a lifestyle for the believer, discovering how man&rsquo;s entire existence is tied to living in and depending upon God&rsquo;s presence.</p>`},

{ id:"p59", t:"RBI Classes &mdash; Year Two", n:"59", h:`
<h2 class="ph">CLASS DESCRIPTIONS</h2>
<h3>RIVER BIBLE INSTITUTE CLASSES &ndash; Year Two</h3>
<p><b>Apologetics</b> &ndash; This course will teach the biblical, theological and historical foundations of Christian apologetics with emphasis on defending the doctrine of the Holy Spirit. It will demonstrate reasons to be confident in the truth of Scripture as well as identify and critique frequently encountered objections and challenges, both historical and contemporary, which have been brought against the Holy Spirit. Students will also recognize and evaluate various apologetic methodologies, and integrate biblical, theological, philosophical, historical, and scientific arguments for the truth of the Christian faith.</p>
<p><b>Bible Doctrines</b> &ndash; In this course, we will take time to study the subjects of what we believe and understand why we believe them. We will also begin to build a solid foundation on the biblical truths that our doctrine is built upon, as well as exposing false doctrines concerning what we believe.</p>
<p><b>Blood Covenant</b> &ndash; This course will involve biblical study into the covenants, their creation and duration, with particular emphasis on the Blood Covenant and its implications for the believer. This course will also examine both of the old and new covenant, their similarities and their application for today.</p>
<p><b>Book of Acts</b> &ndash; This course will give you an understanding of The Book of Acts with the emphasis on The Work of the Holy Spirit throughout.</p>
<p><b>Christ the Healer</b> &ndash; This course will help to establish, from the scriptures, that it is God&rsquo;s will to heal all today and to correct wrong thinking about certain passages of scripture misunderstood by those who oppose divine healing.</p>
<p><b>Devils &amp; Demons</b> &ndash; This class presents a thorough understanding of the different types of angels and their workings and the mode of operation of Satan and his demons.</p>
<p><b>Eschatology</b> &ndash; Eschatology is the branch of theology that deals with the final consummation of all things. We will cover such subject matter as the rapture, the tribulation, judgment, and the life to come.</p>
<p><b>Faith II</b> &ndash; This course is designed to increase the student&rsquo;s understanding of faith and the lifestyle of walking by faith.</p>
<p><b>Leadership</b> &ndash; This course will develop a biblical foundation for leadership. Students will discover principles that will help them to develop leadership qualities in their lives.</p>
<p><b>The Love Walk</b> &ndash; In this course the student will be encouraged, exhorted and provoked to press into God, make a decision and a commitment to really get to know the Father. The student will learn that by walking in the love of god, one can walk in victory in every area of life.</p>
<p><b>Merchandising and Trafficking the Anointing</b> &ndash; This course teaches the aspiring minister how to honor and respect the Anointing and the consequences of compromise when serving God. This course will also empower and equip each student on how to confront temptation to abuse the Anointing to ensure that they walk in freedom and righteousness by the power of the Word and the Holy Spirit.</p>
<p><b>The Minister&rsquo;s Family</b> &ndash; The course&rsquo;s purpose is to give the student called into ministry a thorough understanding of the practicalities and demands of ministry placed on the family and how to deal with them successfully; in other words, how to balance family and ministry correctly.</p>
<p><b>Ministry Gifts</b> &ndash; This course will cover Ministry Gifts and the Divine Call. Students will develop an understanding that, as ministers of the Gospel, we are entrusted with God&rsquo;s strength and might.</p>`},

{ id:"p60", t:"RBI Classes &mdash; Year Two", n:"60", h:`
<p><b>Missions</b> &ndash; This course introduces the biblical, historical, cultural, and strategic dimensions of God&rsquo;s global plans and purposes. It addresses the basis of and necessity for true and biblical world missions as well as the importance of every believer finding and fulfilling God&rsquo;s specific mission for their lives. We will explore the call and cost of missions by following the missionary journeys of the apostle Paul and one of the greatest missionaries of the 19th century, Dr. David Livingstone. This course will teach the student practical knowledge on how to launch into full time or part time missions work. We will also explore the call and the cost of missions, by following the life story of David Livingstone, one of the greatest missionaries of our time.</p>
<p><b>Prayer II</b> &ndash; In this course, the student will understand the importance of prayer, also learning how to pray effectively.</p>
<p><b>Revival: Nothing More, Nothing Less</b> &ndash; The student will become familiar with the characteristics of revival, evidences of a true revival, key ingredients to see a move of God, how to contend for revival, marks of a true evangelist, how to deal with familiarity and offenses that hinder the move of God and the meaning of Pentecost.</p>
<p><b>Shaking the Nations</b> &ndash; In this course you will learn what it takes to shake nations for the Kingdom of God and what truly brings about genuine transformation to nations. This course focuses on how to confront religion, finances to shake a nation, keeping the message pure, how miracles draw the unsaved to the Kingdom and so much more.</p>
<p><b>Signs &amp; Wonders</b> &ndash; The student will learn that signs and wonders should be an everyday occurrence in the believer&rsquo;s life. The student will also come to an understanding that signs, wonders and miracles are not just for the church but they are for the demonstration of the power of God outside the four walls of the church.</p>
<p><b>Soul Winning II</b> - This course on introduction Christ to others in the work place, on foreign fields, and local neighborhoods. Each student will experience the joy of leading others to Christ and then follow up with them to make them disciples.</p>
<p><b>Stewardship II</b> &ndash; In this course powerful insights on the scriptural keys of giving and receiving will be studied in depth as well as the importance of being a faithful and trustworthy steward so that God can touch people&rsquo;s life in the area of finances.</p>
<p><b>Twelve Pillars of Faith</b> &ndash; This course will expound on the foundational truth in God&rsquo;s Word in these twelve pillars: 1) My Heart, 2) My Mission, 3) My Worship, 4) My Family 5) My Treasure, 6) My Father, 7) My Comforter, 8) My Road Map 9) My Absolutes, 10) My Prayer Life, 11) My Crowns, 12) My Jesus</p>
<p><b>Women in Ministry</b> &ndash; In this course, students will learn the leadership roles women had in the New Testament and demonstrate historical examples in regards to the Fivefold Ministry. The weight of New Testament theology and the basic principles of the Gospel will lay the case for women functioning with men working together as partners in the body of Christ.</p>
<p><b>Vision</b> &ndash; In this course, students will learn clear teaching from the Word defining what vision is, how vision is unique to each individual, obstacles that hinder the vision, patience to see the fulfillment of the vision and keeping focused on the vision.</p>`},

{ id:"p61", t:"RBI Classes &mdash; Year Three", n:"61", h:`
<h2 class="ph">CLASS DESCRIPTIONS</h2>
<h3>RIVER BIBLE INSTITUTE CLASSES &ndash; Year Three</h3>
<p><b>Acceleration: No Limits and No Boundaries</b> &ndash; In this course the student will learn the keys to acceleration and how to be increased, multiplied and enlarged by the Spirit of God. They will learn about the call of God on their life, how to get rid of distractions, how to focus, and how to go access supernatural help to do what God has called them to. The student will understand how to move obstacles and mountains by the quickening of heaven to accelerate the very plans of the Kingdom.</p>
<p><b>Call of God and the Fivefold Ministry</b> &ndash; In this course students will learn the value of the call of God, how it connects to the office of the Fivefold Ministry, and the importance of the Fivefold Ministry being active in the local church.</p>
<p><b>Church History</b> &ndash; This course will survey the history of Christianity since the beginning of the church. Emphasis will be given to the charismatic/Pentecostal movements that have arisen since the book of Acts, and that have continued throughout history to the present day. This course will also provide an understanding of the continuous move of the Spirit in the life of the church, culminating in the present move of revival in the world today.</p>
<p><b>The Coming Flood</b> &ndash; This course will build your faith to believe for and expect the flood of the glory of God. Drs. Rodney &amp; Adonica Howard Browne share from experience and teach from the word of God on how the glory of God is coming like a tidal wave to cover the earth. This is a flood of supernatural miracles, signs and wonders &ndash; the likes of which has never been seen since the days of the apostles.</p>
<p><b>Hearing the Voice of God</b> &ndash; In this course Dr. Rodney addresses common misconceptions that cause many Christians to miss the ways and plans of God, while guiding students through the process of tuning into His voice, recognizing His direction, and discerning the voice of a stranger. Students will be equipped to cultivate an intimate walk with God, hear His voice from within their spirit, and confidently follow His plan for your life.</p>
<p><b>Hermeneutics</b> &ndash; This course will prepare students to interpret the Bible from the experience of the Holy Spirit that empowered the church on the day of Pentecost and dynamically shape their reading of Scripture using a fundamental epistemological approach.</p>
<p><b>Homiletics I &amp; II</b> &ndash; The purpose of this course is to acquaint the student with the art and science of preaching known as homiletics. This course is designed to assist the student in organizing themselves, materials and their God-given abilities to effectively minister the Gospel.</p>
<p><b>Ministry of the Evangelist</b> &ndash; This course will give the students a thorough understanding of how the evangelist dovetails with the church as we know it. It will bring practical insight into the traveling evangelist and how things work on the road, as well as show some of the pit falls and how you can overcome them.</p>
<p><b>Ministry Operations</b> &ndash; In this course students will gain practical experience in every department of Revival Ministries International and explore day-to-day operations using department manuals and hands-on training by each department pastor or manager. Students will be trained and leave this course with all the resources needed to build and manage each department in their own ministry when the launch.</p>
<p><b>Pastoral Care and Counseling</b> &ndash; This course is designed to give students a practical and spiritual overview on pastoral ministry. This class will equip the students with sound, biblical wisdom on how to be led by the Spirit in handling pastoral matters as well as to help the student in considering the special issues associated with the theory, practice, and administration of counseling in pastoral contexts.</p>`},

{ id:"p62", t:"RBI Classes &mdash; Year Three", n:"62", h:`
<p><b>Preparation for Ministry</b> &ndash; Through both lecture and hands-on experience, this course is designed to help the student with the practical and business aspects of ministry and to equip them with the tools needed to begin a ministry.</p>
<p><b>Youth and Children&rsquo;s Ministry</b> &ndash; Each student will learn how to build and operate a successful children&rsquo;s and youth ministry in the structure of the local church. Whether operating as a senior pastor, children&rsquo;s pastor, youth pastor or a leader in a church plant or an established church, in a full time or part time volunteer capacity, the student will learn the principles of building a strong children&rsquo;s and youth ministry that supports and strengthens the vision of the house.</p>`},

{ id:"p63", t:"RBI Classes &mdash; M.A. in Practical Ministry", n:"63", h:`
<h2 class="ph">CLASS DESCRIPTIONS</h2>
<h3>RIVER BIBLE INSTITUTE CLASSES &ndash; M.A. in Practical Ministry</h3>
<p><b>Demonology and Deliverance</b> - This course was developed to teach students about unnatural power and satanic dominion over intelligent beings and God's provision for their deliverance. It will teach how to use God's power and authority over all principalities and power.</p>
<p><b>Growing in Godly Character</b> - In this course, students will learn from long-standing ministry leaders about the importance and power of developing Godly character. This course will draw insights from ministers such as Kenneth Copeland, Jerry Savelle, Kenneth Hagin, and Lester Sumrall, to name a few. Students will delve deep into the principles of character development from the inside out so that they not only demonstrate the character of Jesus in their communities and ministries, but exhibit the long-lasting faithfulness and integrity required to increase in the influence and anointing to reach nations.</p>
<p><b>Knowing the Holy Spirit</b> &ndash; In this course, students will learn from esteemed ministry leaders who walked in deep, personal relationship with the Holy Spirit. This course will draw insights from anointed ministers such as Jerry Savelle, Reinhard Bonnke, Kenneth Copeland, Lester Sumrall, and Kathryn Kuhlman, among others&mdash;leaders who knew the Holy Spirit intimately and ministered through His power. Students will explore the person of the Holy Spirit, His presence, and how to cultivate a life led by Him. Through biblical teaching and powerful testimonies, students will gain a deeper understanding of how to fellowship with the Holy Spirit, hear His voice, and walk in His anointing to transform lives and nations for the Kingdom of God.</p>
<p><b>Leadership in Ministry</b> - In this course, students will learn from various steadfast men and women of God about Leadership in Ministry. It covers several sermons from renowned men and women in ministry whose leadership impacted the Kingdom of God including Kenneth E. Hagin, Kenneth Copeland, and Mac Hammond, to name just a few. Students will learn Godly leadership principles so that they can guide and lead in excellence in their ministry.</p>
<p><b>Ministering Healing</b> &ndash; In this course, students will learn from renowned ministry leaders about the biblical foundations and practical applications of ministering healing. This course will draw insights from ministers such as Reinhard Bonnke, Kenneth Copeland, T.L. Osborne, and Oral Roberts, among others. Students will explore the spiritual principles and divine authority behind healing, equipping them to operate in faith and boldness through the love and compassion of Jesus. Through biblical teaching and real-world testimonies, students will gain a deeper understanding of God&rsquo;s heart for healing, the anointing of the Holy Spirit, and how to effectively minister to those believing for healing.</p>
<p><b>Now Faith</b> - In this course, students will learn from various men and women of faith. It covers several sermons from renowned men and women of God in ministry whose faith impacted the Kingdom of God including Kenneth E. Hagin, Kenneth Copeland, and John Osteen, to name just a few. Students will learn to study and apply the principles of &ldquo;Now Faith&rdquo; so that their lives will never be the same and be a tremendous inspiration to their lives in ministry.</p>
<p><b>Practical Ministry I, II, II, IV</b> &ndash; Students will engage in practical ministerial experience as well as discussions related to current ministerial issues. The student will be required to participate in the local church, The River a Tampa Bay Church, in a department ministry throughout the semester. In addition, the student will complete a ministry department project to aid in the development of the day-to-day functions of practical ministry. As part of their practical experience they will also develop a weekly devotional series that they will be able to use when they launch into full-time ministry. (Online students who are employed at RMI will turn in their hours worked for credit hours in lieu of being assigned a department at The River at Tampa Bay Church.)</p>`},

{ id:"p64", t:"RBI Classes &mdash; M.A. in Practical Ministry", n:"64", h:`
<p><b>Prayer Power</b> - In this course, students will learn from various steadfast men and women of God about &ldquo;Prayer Power&rdquo;. It covers sermons from renowned men and women in ministry whose prayer impacted the Kingdom of God including Kenneth E. Hagin, Kenneth Copeland, and John Osteen, to name just a few. Students will learn and understand how &ldquo;the prayer of a righteous man makes tremendous power available [dynamic in its working]&rdquo; (James 5:16, AMP) and apply the principles of &ldquo;Prayer Power&rdquo; so that their lives will never be the same.</p>
<p><b>The Favor of God</b> - This course was developed to delve deeper into the favor of God and it will launch students on a spiritual journey guaranteed to change their lives. This course will reveal how the Lord wants to give us success because it makes Him attractive to others when we acknowledge Him as the source. Students will be engaged in a constant pursuit of God, continuously approach Him with the right motives, and always maintain a right attitude to attain all the benefits of God&rsquo;s favor.</p>`},
{ id:"p65", t:"Welcome &mdash; River School of Worship", n:"65", cls:"welcome", h:`
<h2 class="ph">WELCOME FROM THE FOUNDERS AND PRESIDENTS OF<br>THE RIVER SCHOOL OF WORSHIP</h2>
<p>It has been our dream for many years to provide a place where men and women of all ages, backgrounds and experiences could gather together to study and experience the glory of God. As you will discover, River School of Worship is not a traditional music school. It is a training center birthed specifically for those whose strongest desire is to worship in Spirit and in Truth, and where the Word of God and the Holy Spirit come together to produce life, birth ministries and launch them out.</p>
<p>The Word will challenge those of you attending to find clarity in your calling, and be changed by the awesome presence of God. The River School of Worship will deepen your relationship and experience in the Lord, and provide you with new perspective on how to reach others with God's life-changing power. You can be saturated in the Word and the Spirit of God at River School of Worship. It is the place where you will be empowered to reach your high calling and set your world on fire with revival.</p>
<p class="sig">Yours for Revival and the Harvest,</p>
<div class="sigs">
  <div><b>Dr. Rodney Howard-Browne</b><span>Th.D., D.Min., D.D.</span><span>President</span></div>
  <div><b>Dr. Adonica Howard-Browne</b><span>D.Min., M.A., B.A.</span><span>Vice President</span></div>
</div>
<h3>REMARKS FROM THE DEAN OF THE RIVER SCHOOL OF WORSHIP</h3>
<p>Every great move of God throughout history has been characterized by a unique sound - new music comes forth - fresh songs by the Holy Spirit; songs that tell of what God is doing and what He is saying, songs that declare His greatness, songs that touch a generation. Those who write these songs hook up with Heaven and receive from the Holy Spirit divine words and music that propel the move of God further and deeper...that impacts nations!</p>
<p>Here at the River School of Worship we are raising up men and women who can hear the sound of Heaven and we train them to be the psalmists, worship leaders and musicians that can usher people into the presence of God.</p>
<p>A combination of the natural talent that God has gifted them with, a fresh anointing, and a keen understanding of the workings of music make this new breed of musicians and singers the ones who bring the new sounds from Heaven to this earth - this is what RSW is all about!</p>
<p class="sig">God Bless,</p>
<div class="sigs one">
  <div><b>Dr. Mark Cabrera</b><span>Ed.D.</span><span>Dean of the River School of Worship</span></div>
</div>`},

{ id:"p66", t:"RSW Classes &mdash; Year Two", n:"66", h:`
<h2 class="ph">CLASS DESCRIPTIONS</h2>
<h3>RIVER SCHOOL OF WORSHIP &ndash; Year Two</h3>
<p><b>Live Sound, Productions, and Recording</b> &ndash; In this course students will learn the basics of live sound in the church setting. As a worship team, students will learn how to apply basic sound principles that will aid in achieving the desired sound. Students will learn basic principles of sound and the mechanics of a sound system to better understand the sound engineer. Students will learn what goes into recording a band.</p>
<p><b>Music Production I</b> &ndash; An introduction to production music using a Digital Audio Workstation (DAW). The course will cover basic editing techniques, mixing, eq and automation.</p>
<p><b>Music Theory I</b> &ndash; This course will give a basic grounding in music theory, including notating pitch, rhythm, key signatures and tempos. It includes an introduction to the Nashville Numbering system.</p>
<p><b>Psalmody I</b> &ndash; The course introduces students to what praise and worship is, how it works, and how it can totally transform the worshiper.</p>
<p><b>River Worship Project I</b> &ndash; A highly practical course in which students will arrange, record, produce, and mix demos of two original songs.</p>
<p><b>Songwriting I</b> &ndash; In this course on songwriting the student will gain an understanding of the basic building blocks of song composition as well as effective lyric writing. The student will learn the mechanics of songwriting as it pertains to contemporary praise and worship music.</p>
<p><b>Vocal Lab I</b> &ndash; This course will lay foundation in vocal production, develop ones singing voice and practice techniques.</p>
<p><b>Worship Leading I</b> &ndash; This course will give the student a foundation in the practical aspects of worship leading. Attention will be given to understanding basic music directing and worship leading techniques.</p>`},

{ id:"p67", t:"RSW Classes &mdash; Year Three", n:"67", h:`
<h2 class="ph">CLASS DESCRIPTIONS</h2>
<h3>RIVER SCHOOL OF WORSHIP &ndash; Year Three</h3>
<p><b>Leadership in Worship</b> &ndash; This course will explore the role of the leadership in worship, both on and off the platform.</p>
<p><b>Music Administration &amp; Copyright</b> &ndash; This course covers essential issues of issues of administration copyright as they pertain to a church or ministry worship function.</p>
<p><b>Music Production II</b> &ndash; Building on what was learned in Music Production 1, students will learn more advanced, mixing and editing techniques, including use of virtual instruments.</p>
<p><b>Music Theory II</b> &ndash; This course follows on from Music Theory 1 to more advanced reviews of notation, timing and harmony.</p>
<p><b>Psalmody II</b> &ndash; Using the foundation built on the Psalmody 1 course, this course aims to take students to a deeper level of understanding, knowledge, and maturity in their personal walk with the Lord and as a worshiper.</p>
<p><b>River Worship Project II</b> &ndash; A highly practical course in which students will be coached creating fresh worship content for live use and on-line release.</p>
<p><b>Song Writing II</b> &ndash; This course will expand on Song Writing 1 and students will coached through writing songs for a recording project.</p>
<p><b>Vocal Lab II</b> &ndash; This course will provide a general knowledge of the workings of the voice and how to use it as one of your best God-given assets, both in speaking and singing, as well as helping others develop their God-given vocal abilities.</p>
<p><b>Worship Team Administration</b> &ndash; This course will teach the student what it takes to build a team, administrative tasks, and the details of developing a worship department.</p>`},

{ id:"p68", t:"Welcome &mdash; River School of Government", n:"68", cls:"welcome", h:`
<h2 class="ph">WELCOME FROM THE FOUNDERS AND PRESIDENTS OF<br>THE RIVER SCHOOL OF GOVERNMENT</h2>
<p class="verse">Moreover, you shall choose able men from all the people - God-fearing men of truth who hate unjust gain - and place them over thousands, hundreds, fifties, and tens, to be their rulers. Exodus 18:21 AMP</p>
<p>The River School of Government (RSG) has been founded as a result of the corruption we see in the current government system and the need to raise up godly individuals with personal and public integrity to boldly take up positions of leadership in our nation. For hundreds of years the Constitution of the United States of America, the supreme law of the land, has stood as a bulwark of righteousness, to protect the rights of its citizens. However, there have been attacks, from many quarters, all designed to neutralize the Constitution and to progressively remove citizen's rights.</p>
<p>There is a great need to raise-up individuals who will run for office in the United States of America, from the very bottom all the way to the highest levels of government, who will honor and stand up for both the integrity of the Constitution and the integrity of God's Word. If we are going to see America changed for the good, we have to get back to her founding principles, which were laid out by the founding fathers at her inception. This is the heart and soul and primary focus of the River School of Government.</p>
<p>The student will be trained in every area of governmental leadership and responsibility, and upon successful graduation will be entrusted with specific positions, tasks and responsibilities, each according to their ability and calling. The River School of Government's goal is not to raise-up career politicians, who will abuse their position for personal gain or for personal power, but to raise-up people who will govern according to solid godly principles and who will continue to faithfully defend the individual rights and freedoms that are guaranteed by both the Constitution and God's Word.</p>
<p>The River School of Government is non-partisan and has one objective - to raise-up people in government, who are armed with a solid foundation in the Constitution, God's Holy Word, and the power of the Holy Spirit - to take America back!</p>
<p class="sig">Yours for Revival and the Harvest,</p>
<div class="sigs">
  <div><b>Dr. Rodney Howard-Browne</b><span>Th.D., D.Min., D.D.</span><span>President</span></div>
  <div><b>Dr. Adonica Howard-Browne</b><span>D.Min., M.A., B.A.</span><span>Vice President</span></div>
</div>
<h3>REMARKS FROM THE DEAN OF THE RIVER SCHOOL OF GOVERNMENT</h3>
<p>Men and women with a call, an anointing for leadership and a voice to our nation are being raised up to defend our Constitution and declare the Word of God. People of integrity and people of character, solidly grounded in the Word of God, is what we must have in this nation's political arena. If you have a burning desire within you to affect a change in the political course of this nation, the River School of Government is for you! Our staff and faculty are ready to help you succeed in running with the Heavenly Vision. America must have a change, bringing it back to the foundation of its godly heritage. To do this, bold men and women must step out from behind the cloak of obscurity and raise their voice, allowing God to establish their platform and place them in positions of leadership and government in civic, state, and national levels. Are you ready to accept the challenge?</p>
<div class="sigs one">
  <div><b>Dr. Mark Cabrera</b><span>Ed.D.</span><span>Dean of the River School of Government</span></div>
</div>`},

{ id:"p69", t:"RSG Classes &mdash; Year Two", n:"69", h:`
<h2 class="ph">CLASS DESCRIPTIONS</h2>
<h3>RIVER SCHOOL OF GOVERNMENT - Year Two</h3>
<p><b>American Fundamental Liberties</b> &ndash; This course will teach the foundation for understanding the principles &amp; purpose of the rights enumerated with in the Bill of Rights. We will study in detail the principles of Liberties of the First, Second, Fourth through Eighth Amendments, and Due Process.</p>
<p><b>American History I</b> - This is a glance into the shaping and molding of Early American History and Government, by studying the events that have shaped our nation and our culture and knowing the key people, conflicts, agreements and documents that have formed us into the United States of America.</p>
<p><b>American History II</b> - This is a glance into the shaping and molding of Early American History and Government, by studying the events that have shaped our nation and our culture and knowing the key people, conflicts, agreements and documents that have formed us into the United States of America.</p>
<p><b>Christian Influence in Government</b> &ndash; Explore the Biblical and religious context that gave us our Constitutional and governmental principles. Compare the counter-Christian and Ant-theistic philosophies (such as Sharia) that are incompatible with our Republican structure of government</p>
<p><b>Constitution I</b> &ndash; This course lays the foundation for all understanding of the Constitution and general government. It will educate the student on the wisdom and historical principles behind our Constitutional Republic and the reason and boundaries for a limited and defined government.</p>
<p><b>Constitution II</b> &ndash; This course lays the foundation for understanding the creation of State and local governments, the creation of the Constitution, and the legal and historical principles that created both. It will educate the student on the difference between a national and federal government, the proper distribution of power between the States &amp; the federal government, and the checks and balances created to maintain a limited and defined federal government.</p>
<p><b>Constitution III</b> &ndash; In this course the student will be taught the structure and approach to learning from the Federalist Papers &amp; Anti-Federalist Papers. We will also study the purpose and principles of the Bill of Rights which will give the student the tools necessary to defend these Rights from any attack, subtle or direct.</p>
<p><b>Creature From Jekyll Island</b> &ndash; The emphasis of this course will be to educate the student on the Federal Reserve System, its objectives, its power, and its threat.</p>
<p><b>Killing of Uncle Sam</b> &ndash; This class captures details of the last 200 years of American history and dissect the &ldquo;legalized&rdquo; system of private central banks that has gone unchecked and teaching students truths about the real domestic and foreign enemies of the United States, which will give students a passion to make a difference in their nation.</p>
<p><b>Local Laws</b> &ndash; This course will provide you with an overview of the role that ethical, cultural, and biblically moral principles play in the formulation and execution of public policy by lawmakers and other public officials.</p>
<p><b>Reasoning &amp; Critical Thinking</b> &ndash; God is rational and He has created us as rational beings. This course presents the major components of logical thinking in a Christian context including syllogisms, valid and invalid conclusions and logical fallacies.</p>
<p><b>Research &amp; Writing</b> &ndash; In this course the student will learn how to effectively and efficiently research topics of governmental &amp; political importance and then communicate those ideas professionally in written form. There will also be an element of public speaking where the student will present their written research to the class as an oral presentation.</p>
<p><b>Running For Office</b> &ndash; In this course, students will learn the different facets of running for political office in the United States. A wide range of topics will be covered, including: developing a campaign plan, putting together a campaign team, fundraising, messaging and branding, looking the part, networking, and getting out the vote.</p>`},

{ id:"p70", t:"RSG Classes &mdash; Year Three", n:"70", h:`
<h2 class="ph">CLASS DESCRIPTIONS</h2>
<h3>RIVER SCHOOL OF GOVERNMENT &ndash; Year Three</h3>
<p><b>Comparative Politics</b> &ndash; Students will compare the political philosophies and systems operating for and against the U.S.A. and look into the various groups and actors engaged in political action in the U.S.A.</p>
<p><b>Contemporary Issues in America</b> &ndash; In this course, students will discuss the current moral issues that we face in America today and how the Holy Spirit is moving in and amongst the leaders of this nation. Issues will be addressed and weighed according to the measure and weights established by God.</p>
<p><b>Contract and Constitutional Law</b> &ndash; In this course the student will be taught the basic legal principles and doctrines of Contract and Constitutional Law. The student will learn to read case law and identify, in practical application, the basics of Contract and Constitutional Law.</p>
<p><b>Government and Family</b> &ndash; The emphasis of this course will be to educate the student in how that applying biblical standards in how the government works with the American family, in regards to family structure, marriage, abortion and education, the traditional American family can remain intact.</p>
<p><b>Killing The Planet</b> &ndash; The student will investigate in detail, the evolution of financial control that has enabled central acquisition of power and control that is leading us down a path of loss of freedoms.</p>
<p><b>Leadership &amp; Strategic Thinking</b> &ndash; The emphasis of this course will be on effective ways a student can be molded into a leader that God can use in the political arena. Areas of strategic thinking will be discussed causing the student to see beyond the superficial and focus on the real issues at-hand and how to deal with them.</p>
<p><b>Practical Legislative Process</b> &ndash; Students will learn about the legislative process and how legislatures choose to address the issues of the day. Students will discuss how America is being transformed by the political process of the legislature and examine how biblical principles are (or are not) being upheld. Students will explore how applying godly principles to legislation and the legislative process would change the nation.</p>
<p><b>Religion &amp; Foreign Policy</b> &ndash; Religion has played a role in America&rsquo;s foreign policy since its very beginnings and has remained a constant foreign policy variable. This course is an introduction to the historical roots and contemporary relevance of religion as a variable within American foreign policy. The course examines the details, themes and relevancies of religion as an input to the foreign policy process and object of American foreign policy practice.</p>
<p><b>Senior Seminar</b> &ndash; This Senior Seminar serves as the capstone course for students completing their undergraduate studies in history, government, or political science at River School of Government. This course mirrors the structure of a Ph.D. thesis class, guiding students through the process of developing and defending an original, well-researched dissertation. Students will select a unique research topic in consultation with the instructor and craft an original contribution to their field. Their work must engage with major theoretical debates and historical/political developments while demonstrating mastery of research, critical thinking, and academic writing.</p>
<p><b>Socialism Under the Microscope</b> - Socialism is the appetizer before the main course of communism takes full control. Hatred of God is the main driving force in the Marxist system and militant atheism is central. Socialism places all power in the hands of an elite oligarchy in control of government in order to neutralize the people&rsquo;s power and ability to resist.</p>
<p><b>State Sovereignty Strategy</b> &ndash; Students will be taught how to use the knowledge acquired in previous courses to examine and objectively interpret current events according to the Constitution, history, and wisdom established over a millennium. In-depth study of the Articles of the Constitution and the Bill of Rights as directed by St. George Tucker, the premier authority on the Constitution will be included.</p>
<p><b>Tower of Basel</b> &ndash; The student will dive into an in-depth history of one of the most mysterious global financial institutions in the world: the Bank for International Settlements.</p>`},

{ id:"p71", t:"Welcome &mdash; River Culinary Institute", n:"71", cls:"welcome", h:`
<h2 class="ph">WELCOME FROM THE FOUNDERS AND PRESIDENTS OF<br>THE RIVER CULINARY INSTITUTE</h2>
<p>The River Culinary Institute was founded to raise up a new breed of Culinary and Hospitality industry leaders. We are committed to training up exceptional men and women, who are Holy Ghost &amp; fire-filled frontrunners in culinary innovation and excellence. In doing so, our curriculum encompasses comprehensive in-class instruction, hands-on application, and ministry service opportunities, ensuring students are fully equipped from the inside out to fulfill God&rsquo;s plans for their lives.</p>
<p>As a student of The River Culinary Institute, you will learn how to couple the anointing, creativity, and hard work to reach diverse culinary and hospitality communities with the Gospel of Jesus Christ. Upon successful completion of this program, you will have the experience and expertise to impact your realm of influence with professional standards consistent with God&rsquo;s Word.</p>
<p class="sig">Yours for Revival and the Harvest,</p>
<div class="sigs">
  <div><b>Dr. Rodney Howard-Browne</b><span>Th.D., D.Min., D.D.</span><span>President</span></div>
  <div><b>Dr. Adonica Howard-Browne</b><span>D.Min., M.A., B.A.</span><span>Vice President</span></div>
</div>
<h3>REMARKS FROM THE DEAN OF THE RIVER CULINARY INSTITUTE</h3>
<p>The River Culinary Institute welcomes you as you embark on a remarkable journey of ministerial excellence in Christian culinary and hospitality. We believe that the culinary arts and serving others is not only a skill but also a ministry. As future culinary professionals, you will have the opportunity to use your culinary talents to bless and lift up others.</p>
<p>Our curriculum, is designed to equip you with the necessary culinary skills while instilling in you the values of excellence, attention to detail, and servant leadership. We offer state-of-the-art culinary facilities equipped with the latest industry tools and technologies. From high-quality kitchen equipment to modern cooking techniques, our facility is designed to provide you with an immersive learning experience to enhance your learning and prepare you for success.</p>
<p>We believe that attending our culinary school is an opportunity for you to fulfill the call of God on your life. Your passion for culinary arts is not a coincidence and the River Culinary Institute will help you discover and nurture your passion to bring glory to God. May your time with us be filled with joy, learning, and the fulfillment of God&rsquo;s purpose in your life.</p>
<div class="sigs one">
  <div><b>Dr. Mark Cabrera</b><span>Ed.D.</span><span>Dean of the River Culinary Institute</span></div>
</div>`},

{ id:"p72", t:"RCI Classes &mdash; Year Two", n:"72", h:`
<h2 class="ph">CLASS DESCRIPTIONS</h2>
<h3>RIVER CULINARY INSTITUTE - Year Two</h3>
<p><b>Baking and Breads</b> &ndash; This is a foundation course in Culinary - baking and breads are a learnt art skill and something that can take years to master. Students will learn the different techniques in baking and bread making in order to operate in a commercial kitchen.</p>
<p><b>Culinary Nutrition</b> &ndash; This course will teach students the scientific process of how the body breaks down different food groups. This course also will show how our food choices affect our bodies and how it performs on a daily basis.</p>
<p><b>Etiquette in Fine Dining</b> &ndash; Students will be introduced to &ldquo;Front of House&rdquo; and how serving guests plays a significant role in the restaurant industry. Students will also learn basic fine dining eating etiquette and how important it is to present the food in a creative, yet proper manner for guests to enjoy.</p>
<p><b>Knife Skills 101</b> &ndash;Students will learn about different knives and their purpose in their knife kit. They will also learn how to sharpen and take care of them accordingly. Each week the student will also be learning how to master different knife cuts necessary to operate in a commercial kitchen.</p>
<p><b>Knife Skills 102</b> &ndash; This course will teach students the different anatomies of animals we harvest meat from to identify the different cuts of meats. Students will then learn how to break down these animals effectively with as little as waste as possible.</p>
<p><b>Meats and Poultry</b> &ndash; In this course, students will be introduced to the different cooking techniques on how to prepare different proteins for different occasions.</p>
<p><b>Restaurant Stations &amp; Purposes</b> &ndash; This course will introduce the students to the setup and hierarchy of the kitchen and explain in detail every position and its purpose. This course will also teach the students how every part of the kitchen is important and how it needs to work together to fulfill the whole vision of the restaurant.</p>
<p><b>Rice, Grains and Legumes</b> &ndash; This course will introduce the students to different grains and starches and the different preparation methods of the staple diet ingredients. Students will also learn how to interpret a simple ingredient in different cooking styles and different flavor profiles.</p>
<p><b>Sanitation and Servsafe Certification</b> &ndash; Proper training in how to maintain a Food Safety Regulated kitchen according to the Department of Health. This will also deal with how to prevent food borne or chemical illnesses due to the lack of proper care and sanitation in the commercial kitchen. This course will conclude with a day set aside for each Culinary Student to be certified in a Servsafe Food Safety course for legal and insurance purposes to be able to work in L&rsquo;Adon and Studio B Experience.</p>
<p><b>Spirit of Excellence in the Hospitality Industry</b> &ndash; This course will teach the students the basics of the most important station in the kitchen - the saucier. Students will learn the foundation of a good stock which you can build upon in the form of soups and sauces and teach them how to master all the different required sauce techniques needed in running a fine dining institution.</p>
<p><b>Stock, Soups and Sauces</b> &ndash; This course will teaches the basics of the most important station in the kitchen - the saucier. Students will learn the foundation of a good stock which you can build upon in the form of soups and sauces and teach them how to master all the different required sauce techniques needed in running a fine dining institution.</p>
<p><b>The Ministry of Hospitality</b> &ndash; A Biblical perspective on the important of Hospitality as a ministry and how to implement it accordingly in the area of Culinary / Hospitality. This subject will also expose possible pitfalls that can occur when working with others in serving people.</p>`},

{ id:"p73", t:"RCI Classes &mdash; Year Three", n:"73", h:`
<h2 class="ph">CLASS DESCRIPTIONS</h2>
<h3>RIVER CULINARY INSTITUTE - Year Three</h3>
<p><b>Agriculture</b> &ndash; This course provides restaurant professionals with a comprehensive understanding of sustainable agricultural practices and their importance in sourcing high-quality, local ingredients. Students will learn how to cultivate relationships with farmers, understand seasonal produce cycles, and support sustainable farming techniques that benefit both the environment and their menu offerings. The course emphasizes the intersection between agriculture and restaurant operations, covering topics such as farm-to-table sourcing, sustainable farming practices, local food systems, and how to create a menu that celebrates agricultural diversity.</p>
<p><b>Bread 102</b> &ndash; This intensive, hands-on course is designed for students who have a foundational knowledge of bread making and wish to deepen their expertise in artisan and advanced bread techniques. Advanced Bread Making explores the science, artistry, and precision required to produce complex, high-quality breads using traditional and modern methods. Students will work with a variety of flours, fermentation styles, and shaping techniques, mastering the control of time, temperature, hydration, and natural leavening. Emphasis is placed on long fermentation, sourdough cultures, enriched doughs, and regional European bread styles, along with decorative and professional presentation.</p>
<p><b>Cheese</b> &ndash; From Milk to Masterpiece. This course explores the fascinating world of cheese, delving into its rich history, diverse production methods, and myriad varieties. Students will gain a foundational understanding of the science behind cheese-making, including the role of milk, cultures, enzymes, and aging. We will journey through different cheese families &ndash; from fresh and soft-ripened to semi-hard and aged hard cheeses &ndash; discovering their unique characteristics, flavor profiles, and culinary applications. Practical elements will include sensory evaluation techniques and an introduction to pairing cheese with complementary foods and beverages. This course will deepen your appreciation for this ancient and evolving culinary art form.</p>
<p><b>Confectionary</b> &ndash; This course offers a comprehensive introduction to the art and science of confectionery within the professional baking environment. Students will explore classic and contemporary techniques for creating a variety of sweet baked goods. Emphasis is placed on technique, ingredient functionality, consistency, and presentation. Hands-on practice will develop student proficiency in producing high-quality baked confections suitable for retail and upscale bakery settings.</p>
<p><b>Drink pairings / Coffee</b> &ndash; Drink Pairings and Coffee is an in-depth exploration of how beverages&mdash;particularly coffee&mdash;can enhance and complement a wide range of culinary experiences. Students will study coffee origins, brewing techniques, and flavor profiling, while also learning how to pair drinks such as teas, sodas, and non-alcoholic cocktails with various foods. Emphasis will be placed on balancing acidity, sweetness, and texture to create harmonious pairings. Through both theoretical instruction and hands-on tasting, this course prepares students to thoughtfully craft beverage menus for cafes, events, or professional culinary settings.</p>
<p><b>International Cuisine</b> &ndash; This course introduces students to the diverse culinary traditions, techniques, and ingredients of global cuisines. Emphasis is placed on the cultural, historical, and geographical influences that shape regional food practices. Students will explore representative dishes from Asia, Europe, Latin America, the Middle East, and Africa, while learning authentic cooking methods, flavor profiles, and presentation styles. In this class students gain a deeper understanding of international ingredients, culinary terminology, and global food customs.</p>`},

{ id:"p74", t:"RCI Classes &mdash; Year Three", n:"74", h:`
<p><b>Leadership: How to Lead a Team</b> &ndash; This course provides students with a foundational understanding of leadership through the lens of personal growth and spiritual development. Using Joyce Meyer&rsquo;s A Leader in the Making as the primary text, students will explore what it means to lead with integrity, humility, and resilience. Emphasis is placed on the development of character, recognizing leadership potential, overcoming personal challenges, and learning to lead by example.</p>
<p>Students will engage with topics such as servant leadership, perseverance through trials, handling criticism, and trusting God's timing in leadership development. Students will examine how personal transformation precedes effective leadership.</p>
<p><b>Marketing a Restaurant/ Menu Composition</b> &ndash; In a competitive foodservice industry, great food alone is not enough&mdash;effective marketing is essential to a restaurant&rsquo;s success. This course explores the principles and practices of modern restaurant marketing, branding, and customer engagement. It provides students with the tools to develop and implement strategic marketing plans tailored to various restaurant formats and target audiences. Students will examine real-world case studies, analyze successful marketing campaigns, and apply branding techniques to develop their own promotional strategies. The course covers both traditional and digital marketing channels, including social media, influencer partnerships, local outreach, and loyalty programs.</p>
<p><b>Molecular Gastronomy</b> &ndash; The Molecular Gastronomy course introduces students to the cutting-edge techniques that combine culinary arts with scientific principles to create innovative and visually captivating dishes. In this course, students will explore the transformation of ingredients at a molecular level using modern tools and equipment, such as liquid nitrogen, sous-vide cooking, spherification, and emulsification. Throughout the course, students will learn not only the science behind these techniques but also how to apply them in the kitchen to push the boundaries of traditional cooking. This course is designed to inspire creativity, enhance technical skills, and provide students with the knowledge to experiment and innovate in their culinary practice.</p>
<p><b>Restaurant Business 101</b> &ndash; The Restaurant Business Studies course is designed to provide students with the essential business and management skills required to run a successful restaurant. This course blends the practical aspects of the restaurant industry with theoretical knowledge, focusing on financial management, operational efficiency, customer service, and the strategic decision-making required to thrive in a highly competitive market. Students will explore a variety of topics, including restaurant finance, menu design, marketing strategies, inventory management, and staff recruitment and training. Through case studies, interactive lessons, and hands-on projects, students will gain an in-depth understanding of the daily operations and long-term considerations involved in owning or managing a restaurant.</p>
<p><b>Restaurant Business 102</b> &ndash; This course is a follow up to Restaurant Business 101 and delves deeper into more practical aspects of starting a business, how to hire the right people for the job and how to have a Kingdom Mindset in a secular business.</p>
<p><b>The Art and Science of Eggs</b> &ndash; Eggs are one of the most versatile, foundational ingredients in the culinary world, used across cultures in both sweet and savory applications. The Art and Science of Eggs is a focused, hands-on course that explores the full potential of this essential ingredient&mdash;from classical techniques to modern innovations. Students will study the structure, composition, and functionality of eggs, gaining insight into how they react to heat, movement, and other ingredients. The course emphasizes proper techniques, precision, and timing in egg-based preparations, laying a strong foundation for success in professional kitchens.</p>`},
{ id:"p75", t:"Welcome &mdash; River School of Media", n:"75", cls:"welcome", h:`
<h2 class="ph">WELCOME FROM THE FOUNDERS AND PRESIDENTS OF<br>RIVER SCHOOL OF MEDIA</h2>
<p>In 2011, the Lord opened the door to television through CTN (Christian Television Network). That moment marked a supernatural acceleration of the ministry. Since then, tens of millions have come into the Kingdom. We carry a divine mandate to use every tool God has placed in our hands to proclaim the Gospel of the Kingdom to the ends of the earth to spark another Great Spiritual Awakening in every corner of the globe.</p>
<p>The River School of Media was birthed out of this heavenly assignment, to raise up a new breed of revivalists who will carry the Gospel to the ends of the earth using every method available through media and technology. We believe the Church should be on the cutting edge leading the way, not lagging behind or taking full advantage of the tools that have been made available to us. God is calling men and women full of the Word and full of the fire of the Holy Ghost to take back the platforms and technologies that have long been used for darkness. For generations, media has been used to manipulate culture, but it&rsquo;s time to take it back for the glory of God. This school is not for spectators. It is for those who burn with the call to win the lost at any cost and to do it with excellence, power, and boldness.</p>
<p>Get ready. You&rsquo;ve just stepped into your assignment.</p>
<div class="sigs">
  <div><b>Dr. Rodney Howard-Browne</b><span>Th.D., D.Min., D.D.</span><span>President</span></div>
  <div><b>Dr. Adonica Howard-Browne</b><span>D.Min., M.A., B.A.</span><span>Vice President</span></div>
</div>
<h3>REMARKS FROM THE DEAN OF RIVER SCHOOL OF MEDIA</h3>
<p>The River School of Media welcomes you as you begin an extraordinary journey of spiritual purpose and creative excellence in the world of Christian media and communication. We believe that media is not just a platform but a powerful ministry tool&mdash;one that can carry the message of the Gospel to the ends of the earth.</p>
<p>Our program is designed to equip you with both the technical expertise and spiritual depth needed to influence culture through film, television, digital production, and emerging technologies. With hands-on training in state-of-the-art media facilities and instruction from seasoned professionals, you&rsquo;ll develop the skills, vision, and confidence to lead in today&rsquo;s rapidly evolving media landscape.</p>
<p>We believe your passion for media is not accidental&mdash;it is part of God&rsquo;s calling on your life. Here, you will be trained not only to create, but to impact lives, redeem platforms, and carry the fire of the Holy Spirit into every sphere of communication. May your time at the River School of Media be filled with inspiration, growth, and the unfolding of God&rsquo;s purpose for your life in the realm of media.</p>
<div class="sigs one">
  <div><b>Dr. Mark Cabrera</b><span>Ed.D.</span><span>Dean of the River School of Media</span></div>
</div>`},

{ id:"p76", t:"RSM Classes &mdash; Year Two", n:"76", h:`
<h2 class="ph">CLASS DESCRIPTIONS</h2>
<h3>RIVER SCHOOL OF MEDIA - Year Two</h3>
<p><b>Broadcast Foundations</b> &ndash; Understand how a broadcast comes together. Learn switchers, graphics, camera shading, and control room workflow.</p>
<p><b>Editing &amp; Post-Production 101</b> &ndash; Introduction to DaVinci Resolve &amp; Adobe Premiere. Learn cutting, music use, audio mixing, and basic color correction to craft Gospel-centered videos.</p>
<p><b>Film &amp; Lighting 101</b> &ndash; Master the basics of 3-point lighting, mood creation, and contrast control. Includes hands-on studio labs and lighting setup training.</p>
<p><b>Into the 21st Century &ndash; Media History for the Digital Evangelist</b> &ndash; Based on the prophetic teachings of Dr. Rodney Howard-Browne from his &ldquo;Orlando&rdquo; camp meeting in the 1990s, this course explores how the Church has historically harnessed media to spread the Gospel &mdash; from early symbols and manuscripts through stained glass, the printing press, radio, and television, right up to today&rsquo;s social media and digital platforms. Students will study key moments of reformation and revival that sparked increase in technology and learn from Pentecostal media pioneers like Rodney Howard-Browne, T.L. Osborn, A.A. Allen, and Oral Roberts and engage with Dr. Howard-Browne&rsquo;s vision for leveraging cutting-edge technology to ignite revival and reach the lost in the digital age. This class prepares students to operate at the forefront of media evangelism with spiritual authority and technological savvy.</p>
<p><b>Live Audio &amp; Broadcast Audio</b> &ndash; Learn signal flow, mic placement, live and post audio mixing, introduction to recording and mastering software.</p>
<p><b>Live Production Camera Training</b> &ndash; Build and operate broadcast cameras for live services. Training includes tally, intercom, framing, and real-world use.</p>
<p><b>Media Team Systems &amp; Operations</b> &ndash; Learn team scheduling, volunteer pipelines, and production planning tools like Planning Center and Slack.</p>
<p><b>Photography 101</b> &ndash; Learn shot composition, the exposure triangle, and the art of visual storytelling. Final portfolio project included.</p>
<p><b>Podcast Studio/ Radio Production</b> &ndash; Produce multi-camera podcast and radio content. Cover set design, audio recording, and visual storytelling in small spaces.</p>
<p><b>Revival Films Workshop</b> &ndash; Students create short films inspired by revival themes and testimonies. Project-based with final screening showcase at RU Banquet.</p>
<p><b>Short Film Directing 101</b> &ndash; Learn blocking, script breakdown, and actor direction to tell compelling stories with spiritual impact.</p>
<p><b>Social Media Ministry</b> &ndash; Craft Gospel-reaching reels, shorts, and content for platforms like Instagram, Facebook, and YouTube. Learn trends, algorithms, and how to strategically market your message to reach the lost.</p>`},

{ id:"p77", t:"RSM Classes &mdash; Year Three", n:"77", h:`
<h2 class="ph">CLASS DESCRIPTIONS</h2>
<h3>RIVER SCHOOL OF MEDIA - Year Three</h3>
<p><b>Advanced Cinematography &amp; Lighting</b> &ndash; Camera movement, lens language, lighting for drama and emotion. Grip gear, diffusion, and advanced rigs for visual storytelling.</p>
<p><b>Capstone Execution Course</b> &ndash; Track-based production: Film a short film, produce a live service, or launch a digital outreach campaign with guidance and deadlines.</p>
<p><b>Capstone Planning Lab</b> &ndash; Students develop proposals for their final Capstone Project. Includes budgeting, crewing, timelines, and instructor approval.</p>
<p><b>Capstone Presentation &amp; Portfolio Building</b> &ndash; Students showcase their final projects and create reels, websites, and portfolios for ministry or media career pathways.</p>
<p><b>Capstone Production</b> &ndash; Finalize and polish Capstone Project. Includes post-production, marketing rollout, and publishing to relevant platforms.</p>
<p><b>Creative Campaigns &amp; Outreach Strategy</b> &ndash; Plan and execute evangelistic campaigns, online funnels, and creative content with targeted calls to action.</p>
<p><b>Editing for Impact</b> &ndash; Advanced DaVinci workflows including color grading, audio sweetening, and editing for emotion and story pacing.</p>
<p><b>Leadership in Media Ministry</b> &ndash; Learn how to lead shoots, solve team challenges, manage production timelines, and plan events. Focus on professional leadership in a creative media environment.</p>
<p><b>Message to Media</b> &ndash; Transform sermons and revival content into reels, podcasts, or films. Learn how to extract core messages and build media around them.</p>
<p><b>On-Camera Presence &amp; Hosting</b> &ndash; Develop skills in voiceover, hosting, and public presentation for digital platforms and on-screen appearances.</p>
<p><b>Production Support &amp; Execution</b> &ndash; Second-year students support Year 3 projects in a production capacity by assisting with lighting, camera, or editing roles to help other teams execute their vision with excellence.</p>
<p><b>Track Elective</b> &ndash; Choose one: Directing for Ministry Media, Broadcast Director Training, Social Media Evangelism II (ads, analytics, reels with purpose)</p>`},

  var COMFORT_FS = 13.5;   // below this we'd rather tighten spacing than shrink more
  var MIN_FS = 8.6;        // absolute legibility floor
  function baseFS(){ return sizes[si]; }

  function fits(sc){ return sc.scrollHeight <= sc.clientHeight + 1; }

  function bestSize(sc, base){
    sc.style.fontSize = base + "px";
    if (fits(sc)) return base;
    var lo = MIN_FS, hi = base, best = MIN_FS;
    for (var k = 0; k < 9; k++){

      sc.style.fontSize = mid.toFixed(2) + "px";
      if (fits(sc)){ best = mid; lo = mid; } else { hi = mid; }

  }

    if (fits(sc)) return;

    var size = bestSize(sc, base);
    if (size >= COMFORT_FS) return;             // fits at a comfortable size already

    pg.classList.add("compact");                // tier 1: tighter leading
    var s1 = bestSize(sc, base);
