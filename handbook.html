<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>River University · Student Handbook 2025–2026</title>
<meta name="theme-color" content="#0f3952">
<meta name="description" content="The River University Student Handbook 2025–2026, in a page-turning digital edition.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f3952;
    --navy-d:#082a3d;
    --navy-l:#17516f;
    --gold:#d6a329;
    --gold-d:#8f6712;
    --ink:#12212b;
    --body-ink:#25404f;
    --paper:#fffdf8;
    --paper-edge:#f0e9dc;
    --room:#dfe5ea;
    --room-2:#c9d3db;
    --line:#dfd7c8;
    --muted:#6c7f8c;

    --display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;

    --fs:17px;
    --dur:620ms;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% 0%, #e8eef3 0%, var(--room) 45%, var(--room-2) 100%);
    color:var(--ink);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ============ Toolbar ============ */
  .bar{
    position:fixed;top:0;left:0;right:0;height:56px;z-index:60;
    display:flex;align-items:center;gap:10px;padding:0 14px;
    background:linear-gradient(180deg,rgba(15,57,82,.97),rgba(8,42,61,.95));
    color:#fff;border-bottom:2px solid var(--gold);
    padding-top:env(safe-area-inset-top);
    height:calc(56px + env(safe-area-inset-top));
  }
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand .r{
    width:26px;height:30px;flex:none;border:2px solid var(--gold);border-radius:3px;
    display:grid;place-items:center;font-family:var(--display);
    font-variation-settings:"wght" 800;font-size:16px;color:var(--gold);
  }
  .brand b{
    font-family:var(--display);font-variation-settings:"wdth" 112,"wght" 700;
    font-size:14px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;
  }
  .brand i{
    display:block;font-style:normal;font-family:var(--mono);
    font-size:9px;letter-spacing:.22em;color:#9fc0d2;text-transform:uppercase;
  }
  .bar .spacer{flex:1}
  .tbtn{
    border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;
    border-radius:9px;height:36px;min-width:36px;padding:0 11px;cursor:pointer;
    font-family:var(--body);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;
  }
  .tbtn:hover{background:rgba(214,163,41,.24);border-color:var(--gold)}
  .tbtn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--navy-d);font-weight:600}
  .tbtn svg{display:block}
  .lbl{display:inline}
  @media (max-width:720px){ .lbl{display:none} .tbtn{padding:0 9px} }

  /* ============ Stage ============ */
  .stage{
    position:fixed;inset:calc(56px + env(safe-area-inset-top)) 0 0 0;
    display:grid;place-items:center;padding:26px 20px 30px;
  }
  .book{
    position:relative;
    width:min(1180px, 100%);
    height:100%;
    max-height:100%;
    perspective:2400px;
    display:flex;justify-content:center;align-items:center;
  }
  .spread{
    position:relative;display:flex;
    height:100%;aspect-ratio:1.545/1;
    max-width:100%;
    transform-style:preserve-3d;
    filter:drop-shadow(0 26px 40px rgba(8,42,61,.34));
  }
  .single .spread{aspect-ratio:.773/1}

  .leaf{
    position:relative;width:50%;height:100%;
    background:var(--paper);
    overflow:hidden;
  }
  .single .leaf{width:100%}
  .leaf.left{border-radius:5px 0 0 5px}
  .leaf.right{border-radius:0 5px 5px 0}
  .single .leaf{border-radius:5px}
  /* gutter shading */
  .leaf.left::after,.leaf.right::after{
    content:"";position:absolute;top:0;bottom:0;width:38px;pointer-events:none;z-index:5;
  }
  .leaf.left::after{right:0;background:linear-gradient(90deg,rgba(80,60,30,0),rgba(80,60,30,.13))}
  .leaf.right::after{left:0;background:linear-gradient(270deg,rgba(80,60,30,0),rgba(80,60,30,.13))}
  .single .leaf::after{display:none}
  .leaf.blank{background:var(--paper-edge)}

  /* page body */
  .pg{
    position:absolute;inset:0;display:flex;flex-direction:column;
    padding:clamp(24px,3.4%,46px) clamp(22px,4.2%,54px) 14px;
  }
  .pg-scroll{flex:1;overflow:hidden;overscroll-behavior:contain;padding-right:4px;position:relative}
  .pg-scroll.scrolls{overflow-y:auto}
  .pg-scroll::-webkit-scrollbar{width:7px}
  .pg-scroll::-webkit-scrollbar-thumb{background:#d8cfbe;border-radius:4px}
  .pg-foot{
    flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
    border-top:1px solid var(--line);margin-top:9px;padding-top:6px;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#a3937a;text-transform:uppercase;
  }
  .leaf.right .pg-foot{flex-direction:row-reverse}

  /* ============ Typography ============ */
  .pg-scroll{font-size:var(--fs);line-height:1.5;color:var(--body-ink)}
  .pg-scroll p{margin:0 0 .78em}
  .ph{
    font-family:var(--display);
    font-variation-settings:"wdth" 112,"wght" 800;
    font-size:1.28em;line-height:1.15;letter-spacing:.005em;
    color:var(--navy);text-transform:uppercase;
    margin:0 0 .6em;padding-bottom:.34em;border-bottom:2px solid var(--gold);
  }
  .pg-scroll h3{
    font-family:var(--display);font-variation-settings:"wdth" 105,"wght" 700;
    font-size:1.03em;color:var(--navy);margin:1.25em 0 .4em;letter-spacing:.01em;
  }
  .pg-scroll h4{
    font-family:var(--body);font-weight:700;font-size:1em;color:var(--navy-l);
    margin:1em 0 .28em;
  }
  .pg-scroll b{color:var(--ink)}
  .pg-scroll a{color:#1a6b94;text-decoration:underline;text-underline-offset:2px}
  .pg-scroll ul,.pg-scroll ol{margin:0 0 .8em;padding-left:1.35em}
  .pg-scroll li{margin-bottom:.32em}
  ol.alpha{list-style:lower-alpha;margin-top:.35em}
  .pg-scroll .sm{font-size:.85em;color:var(--muted)}
  .tight{line-height:1.5}
  p.note{
    background:rgba(214,163,41,.11);border-left:3px solid var(--gold);
    padding:.55em .8em;border-radius:0 5px 5px 0;margin-bottom:.8em;
  }
  p.verse{font-style:italic;color:var(--navy-l);border-left:3px solid var(--gold);padding-left:.9em}
  .pledge li{margin-bottom:.5em}

  table{width:100%;border-collapse:collapse;margin:.4em 0 1em;font-size:.94em}
  th{
    text-align:left;font-family:var(--mono);font-size:.78em;letter-spacing:.09em;
    text-transform:uppercase;color:#fff;background:var(--navy);padding:.42em .62em;font-weight:500;
  }
  td{padding:.34em .62em;border-bottom:1px solid var(--line);vertical-align:top}
  table.fee td:last-child,table.grade td,table.grade th{font-family:var(--mono);font-size:.9em}
  table.fee td:last-child{text-align:right;white-space:nowrap}
  table.grade td:first-child,table.grade th:first-child{width:34%}
  table.ct td:first-child{width:56%}
  table.ct td,table.qt td{border-bottom:1px dotted var(--line)}
  table.codes{width:auto;margin-top:1em}
  table.codes td:first-child{font-family:var(--mono);font-weight:500;color:var(--navy);width:64px}
  table.qt td{width:50%;border-bottom:0;padding-left:0}

  .toc{list-style:none;padding:0;margin:0;font-size:.97em}
  .toc li{display:flex;align-items:baseline;gap:6px;padding:.2em 0;border-bottom:1px dotted #e6dfd1}
  .toc li.i1{padding-left:1.3em;font-size:.94em}
  .toc a{flex:1;cursor:pointer;color:var(--body-ink);text-decoration:none}
  .toc a:hover{color:#1a6b94;text-decoration:underline}
  .toc .pn{font-family:var(--mono);font-size:.82em;color:var(--muted)}

  .index{list-style:none;padding:0;margin:0;font-size:.88em;columns:2;column-gap:26px}
  .index li{break-inside:avoid;display:flex;gap:8px;justify-content:space-between;padding:.09em 0}
  .index li.i1{padding-left:1em;color:var(--muted)}
  .index span{font-family:var(--mono);font-size:.85em;color:var(--muted);text-align:right;flex:none;max-width:52%}

  .fac{list-style:none;padding:0;margin:.6em 0 1em;columns:2;column-gap:26px;font-size:.97em}
  .fac li{padding:.12em 0;break-inside:avoid}
  .fac-lead{display:grid;grid-template-columns:1fr 1fr;gap:.7em 1.2em;margin:.8em 0 1.1em}
  .fac-lead div,.sigs div{line-height:1.32}
  .fac-lead b,.sigs b{display:block;color:var(--navy);font-size:1em}
  .fac-lead span,.sigs span{display:block;font-size:.85em;color:var(--muted)}
  .sig{margin-top:1.2em!important;font-style:italic;color:var(--navy-l)}
  .sigs{display:grid;grid-template-columns:1fr 1fr;gap:.8em 1.2em;margin:.5em 0 .4em}
  .sigs.one{grid-template-columns:1fr;margin-top:1em}

  .siglines{margin-top:2.4em}
  .sl{margin-bottom:1.9em}
  .sl i{display:block;border-bottom:1px solid #97a7b2;height:1.6em}
  .sl span{font-size:.85em;color:var(--muted)}
  .sl.short i{max-width:42%}

  .pg.compact{padding:clamp(18px,2.7%,36px) clamp(17px,3.4%,42px) 11px}
  .pg.compact .pg-scroll{line-height:1.4}
  .pg.compact .pg-scroll p{margin-bottom:.6em}
  .pg.compact .pg-scroll h3{margin:.95em 0 .32em}
  .pg.compact .ph{margin-bottom:.48em}
  .pg.ultra{padding:clamp(14px,2%,27px) clamp(13px,2.6%,32px) 8px}
  .pg.ultra .pg-scroll{line-height:1.31}
  .pg.ultra .pg-scroll p{margin-bottom:.46em}
  .pg.ultra .pg-scroll h3{margin:.7em 0 .24em}
  .pg.ultra .pg-scroll li{margin-bottom:.16em}
  .pg.ultra .ph{margin-bottom:.36em;padding-bottom:.26em}
  .pg.more::after{
    content:"";position:absolute;left:0;right:0;bottom:34px;height:38px;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,253,248,0),rgba(255,253,248,.96));
  }
  mark{background:#ffe9a8;color:inherit;padding:0 1px;border-radius:2px}

  /* ============ Cover / special pages ============ */
  .leaf.cover .pg,.leaf.backcover .pg{padding:0}
  .cv,.bc{
    position:relative;height:100%;overflow:hidden;color:#fff;
    background:
      radial-gradient(130% 100% at 78% 8%, #16506f 0%, #0f3952 42%, #082a3d 100%);
    padding:clamp(26px,6%,52px);
    display:flex;flex-direction:column;
  }
  .cv::before{
    content:"";position:absolute;inset:0;opacity:.16;
    background:
      radial-gradient(circle at 22% 34%, #7fb4d0 0 3px, transparent 3px),
      radial-gradient(circle at 62% 62%, #7fb4d0 0 2px, transparent 2px),
      radial-gradient(ellipse 34% 26% at 30% 40%, rgba(127,180,208,.5), transparent 70%),
      radial-gradient(ellipse 26% 34% at 66% 66%, rgba(127,180,208,.45), transparent 70%);
  }
  .cv > *,.bc > *{position:relative;z-index:2}
  .cv-mark{display:flex;align-items:center;gap:12px}
  .cv-r{
    width:44px;height:52px;flex:none;border:3px solid var(--gold);border-radius:5px;
    display:grid;place-items:center;font-family:var(--display);
    font-variation-settings:"wght" 900;font-size:28px;color:#fff;
  }
  .cv-mark b{
    display:block;font-family:var(--display);font-variation-settings:"wdth" 108,"wght" 500;
    font-size:26px;letter-spacing:.13em;line-height:1;
  }
  .cv-mark i{
    display:block;font-style:normal;font-family:var(--display);
    font-size:11px;letter-spacing:.42em;color:#cfe1ec;margin-top:5px;
  }
  .cv-rule{height:1px;background:rgba(255,255,255,.3);margin:clamp(14px,3%,26px) 0 auto}
  .cv-title{
    font-family:var(--display);font-variation-settings:"wdth" 100,"wght" 900;
    font-size:clamp(34px,7.6vh,62px);line-height:.94;color:var(--gold);
    margin:0 0 .3em;letter-spacing:-.01em;
  }
  .cv-sub{font-size:clamp(13px,1.9vh,17px);color:#9db6c6;line-height:1.35;margin:0 0 clamp(16px,3.4vh,30px)}
  .cv-list{list-style:none;padding:0;margin:0 0 auto}
  .cv-list li{
    font-family:var(--display);font-variation-settings:"wdth" 100,"wght" 700;
    font-size:clamp(11px,1.7vh,15px);letter-spacing:.05em;padding:4px 0 4px 22px;position:relative;
  }
  .cv-list li::before{
    content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:9px;height:9px;background:var(--gold);
  }
  .cv-swoosh{
    position:absolute;right:-18%;bottom:-42%;width:120%;height:88%;
    border-radius:50%;border:14px solid var(--gold);border-color:var(--gold) transparent transparent transparent;
    transform:rotate(31deg);opacity:.9;z-index:1;
  }
  .bc{align-items:center;justify-content:center;text-align:center}
  .bc .cv-mark{flex-direction:column;gap:14px}
  .bc-url{
    font-family:var(--display);font-variation-settings:"wght" 700;
    font-size:12px;letter-spacing:.2em;color:#fff;margin:16px 0 0;
  }
  .leaf.title-page .pg-scroll{font-size:calc(var(--fs) * .96)}
  .tp-mark{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 4px}
  .tp-r{
    width:34px;height:40px;border:3px solid var(--gold);border-radius:4px;display:grid;place-items:center;
    font-family:var(--display);font-variation-settings:"wght" 900;font-size:21px;color:var(--navy);
  }
  .tp-mark b{display:block;font-family:var(--display);font-variation-settings:"wdth" 108,"wght" 500;font-size:21px;letter-spacing:.13em;color:var(--navy);line-height:1}
  .tp-mark i{display:block;font-style:normal;font-family:var(--display);font-size:9px;letter-spacing:.4em;color:var(--navy-l);margin-top:4px}
  .tp-title{
    text-align:center;font-family:var(--display);font-variation-settings:"wdth" 106,"wght" 700;
    font-size:1.5em;color:var(--navy);margin:.5em 0 1em;line-height:1.2;letter-spacing:.02em;
  }
  .idbox{border:2.5px solid var(--navy);padding:.9em 1.05em;margin:0 0 1.1em;border-radius:2px}
  .idrow{display:flex;align-items:baseline;gap:10px;margin-bottom:.85em}
  .idrow:last-child{margin-bottom:2px}
  .idrow span{font-weight:700;color:var(--navy);white-space:nowrap}
  .idrow i{flex:1;border-bottom:1px solid #9bacb6;height:1.1em}
  .welcome .sigs b{font-size:1.02em}

  /* ============ Flip animation ============ */
  .flipper{
    position:absolute;top:0;width:50%;height:100%;z-index:40;
    transform-style:preserve-3d;pointer-events:none;
    transition:transform var(--dur) cubic-bezier(.42,.02,.35,1);
    backface-visibility:hidden;
  }
  .single .flipper{width:100%}
  .flipper.fwd{right:0;transform-origin:left center;transform:rotateY(0deg)}
  .flipper.fwd.go{transform:rotateY(-178deg)}
  .flipper.back{left:0;transform-origin:right center;transform:rotateY(0deg)}
  .flipper.back.go{transform:rotateY(178deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;
    background:var(--paper);
  }
  .face.b{transform:rotateY(180deg)}
  .flipper.fwd .face.f{border-radius:0 5px 5px 0}
  .flipper.fwd .face.b{border-radius:5px 0 0 5px}
  .flipper.back .face.f{border-radius:5px 0 0 5px}
  .flipper.back .face.b{border-radius:0 5px 5px 0}
  .face::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    opacity:0;transition:opacity var(--dur);
  }
  .flipper.fwd .face.f::after{background:linear-gradient(270deg,rgba(0,0,0,.30),transparent 42%)}
  .flipper.fwd .face.b::after{background:linear-gradient(90deg,rgba(0,0,0,.30),transparent 42%)}
  .flipper.back .face.f::after{background:linear-gradient(90deg,rgba(0,0,0,.30),transparent 42%)}
  .flipper.back .face.b::after{background:linear-gradient(270deg,rgba(0,0,0,.30),transparent 42%)}
  .flipper.go .face::after{opacity:1}

  /* click zones */
  .zone{
    position:absolute;top:0;bottom:0;width:12%;z-index:30;cursor:pointer;border:0;background:transparent;
  }
  .zone.prev{left:0}
  .zone.next{right:0}
  .zone:disabled{cursor:default}
  .zone .chev{
    position:absolute;top:50%;transform:translateY(-50%);
    width:38px;height:38px;border-radius:50%;
    background:rgba(15,57,82,.82);color:#fff;display:grid;place-items:center;
    opacity:0;transition:opacity .2s;
  }
  .zone.prev .chev{left:-19px}
  .zone.next .chev{right:-19px}
  .book:hover .zone:not(:disabled) .chev{opacity:.92}
  .zone:disabled .chev{display:none}

  /* ============ Drawers ============ */
  .scrim{
    position:fixed;inset:0;background:rgba(8,42,61,.5);z-index:70;opacity:0;pointer-events:none;
    transition:opacity .22s;
  }
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;bottom:0;left:0;width:min(400px,86vw);z-index:80;
    background:#fff;transform:translateX(-101%);transition:transform .26s cubic-bezier(.3,.7,.3,1);
    display:flex;flex-direction:column;box-shadow:0 0 40px rgba(8,42,61,.3);
  }
  .drawer.on{transform:translateX(0)}
  .drawer header{
    background:var(--navy);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:2px solid var(--gold);padding-top:calc(16px + env(safe-area-inset-top));
  }
  .drawer header h2{
    margin:0;font-family:var(--display);font-variation-settings:"wdth" 110,"wght" 700;
    font-size:15px;letter-spacing:.13em;text-transform:uppercase;
  }
  .xbtn{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1;padding:2px 6px}
  .drawer .body{flex:1;overflow-y:auto;padding:10px 0 30px}
  .navlist{list-style:none;margin:0;padding:0}
  .navlist li a{
    display:flex;gap:12px;align-items:baseline;padding:9px 18px;cursor:pointer;
    color:var(--body-ink);text-decoration:none;font-size:14.5px;border-bottom:1px solid #f0eee9;
  }
  .navlist li a:hover{background:#f3f7fa;color:var(--navy)}
  .navlist li a.cur{background:rgba(214,163,41,.16);color:var(--navy);font-weight:600}
  .navlist .np{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;width:26px;text-align:right}
  .navlist li.sec a{font-family:var(--display);font-variation-settings:"wdth" 106,"wght" 700;
    font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--navy);background:#f7f5f0}

  .srch{padding:14px 16px;border-bottom:1px solid #eae7e1;position:sticky;top:0;background:#fff;z-index:2}
  .srch input{
    width:100%;border:1.5px solid #d9dfe5;border-radius:9px;padding:10px 12px;
    font-family:var(--body);font-size:15px;outline:0;
  }
  .srch input:focus{border-color:var(--navy)}
  .hit{padding:11px 18px;border-bottom:1px solid #f0eee9;cursor:pointer}
  .hit:hover{background:#f3f7fa}
  .hit .ht{font-weight:600;color:var(--navy);font-size:14px;display:flex;justify-content:space-between;gap:10px}
  .hit .ht span{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;flex:none}
  .hit .hx{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4}
  .nores{padding:34px 20px;text-align:center;color:var(--muted);font-size:14px}

  /* ============ Bottom rail ============ */
  .rail{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
    z-index:55;display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
    border:1px solid #cdd8e0;border-radius:999px;padding:5px 6px;
    box-shadow:0 6px 20px rgba(8,42,61,.18);
  }
  .rbtn{
    border:0;background:var(--navy);color:#fff;width:34px;height:34px;border-radius:50%;
    cursor:pointer;display:grid;place-items:center;
  }
  .rbtn:disabled{background:#c3ced6;cursor:default}
  .rbtn:not(:disabled):hover{background:var(--gold);color:var(--navy-d)}
  .counter{
    font-family:var(--mono);font-size:11.5px;color:var(--navy);

{ id:"p5", t:"Introduction", n:"5", h:`
<h2 class="ph">INTRODUCTION</h2>
<p>The purpose of this handbook is to assist current and prospective students by providing information about our institution, its purpose, academic programs, student services, and administrative policies and procedures. All questions should be directed to the Administration Office at the River University campus located at 3738 River International Drive in Tampa, Florida 33610. Tel. (813) 849-6641. Email <a href="mailto:RUadmin@revival.com">RUadmin@revival.com</a>.</p>
<h3>ACCREDITATION AND AFFILIATIONS</h3>
<p>The River University is an institution of higher education and accredited by Transworld Accrediting Commission International located at 9085 California Avenue, Riverside, CA, (951) 901-5586.</p>
<p>River University is recognized by the Florida State Legislature as an incorporated entity of higher learning with the authority to offer undergraduate degrees. River University will equip students to enter the ministry with the fire of God, to win souls, shake nations and take territory for the Kingdom. The impartation that the students of River University receive is through the anointing of the Holy Spirit, which no accrediting agency can give.</p>
<p>Accreditation is a review process by an external agency to ensure that an institution of higher learning meets standards set by organizations representing the academic community, professionals, and other stakeholders. To maintain accreditation the institution or program must undergo a similar review on a regular basis. An outline of the standards used to evaluate River University may be found here. <a href="http://transworldaccrediting.com/accreditation-information/" target="_blank" rel="noopener">http://transworldaccrediting.com/accreditation-information/</a></p>
<p>It is important to note that neither the State of Florida nor the US Federal Government accredits any institution of higher learning. All accrediting agencies are private organizations.</p>
<h3>THE COLLEGE NAME</h3>
<p>The college name, River University (hereinafter RU), is taken from John 7:38-39b, &ldquo;He that believeth on me, as the scripture hath said, out of his belly shall flow rivers of living water. But this spake he of the Spirit, which they that believe on him should receive.&rdquo;</p>
<h3>THE COLLEGE MANAGEMENT SOFTWARE: POPULI</h3>
<p>RU uses a web-based learning management software called Populi which provides a real-time interaction with courses, instructors, grades, transcripts, admissions, billing, and other students. During registration the student will be made an active user and all communications and school interaction will happen from Populi. It is important that each student has an active email and access to a computer to have a successful year here at RU. Populi will be referenced several times in this handbook and refers to this college management system.</p>
<h3>STATEMENT OF NON-DISCRIMINATION</h3>
<p>RU is an equal opportunity Christian educational institution. Qualified applicants are admitted without regard to race, color, national and ethnic origin, handicap status, veteran status, to all rights, privileges, programs and activities generally accorded or made available at the school. We do not discriminate on the basis of race, color, national and ethnic origin in administration of its educational policies, admissions policies, and other school-administered programs.</p>`},

{ id:"p6", t:"Statement of Purpose", n:"6", h:`
<h2 class="ph">STATEMENT OF PURPOSE</h2>
<p>RU encompasses six programs, River Bible Institute, River Bible Institute in Espa&ntilde;ol, River School of Worship, River School of Government, River Culinary Institute and River School of Media. RU programs exist for the purpose of training men and women in the spirit of revival for ministry in the 21st century. This is not just for the full-time minister but for all of God&rsquo;s people who are hungry for more. It is a place where the Word of God and the Holy Spirit come together to produce life, birth ministries and launch graduates into the world of real life missions and ministry.</p>
<p>The <b>River Bible Institute (RBI)</b> program provides quality Spirit-filled biblical instruction, academic training, and practical education to men and women called into the Fivefold Ministry. The ministry program also provides instruction for those who desire to become better equipped in other areas of Christian service. This program is available in Spanish, River Bible Institute in Espa&ntilde;ol (RBIE).</p>
<p>The <b>River School of Worship (RSW)</b> program provides quality Spirit-filled biblical instruction, academic training and practical education to men and women called to be a worship leader. The worship leader program also provides instruction for those who desire to become part of a worship team.</p>
<p>The <b>River School of Government (RSG)</b> program exists for the purpose of training men and women in the spirit of revival for practical work in and with the government of the 21st century. This is not just for those who feel called to run for office but for all of God&rsquo;s people who are hungry to learn more and see change in the political realm.</p>
<p>The <b>River Culinary Institute (RCI)</b> program exists for the purpose of training men and women in Culinary to work in and with the Hospitality Industry and every realm it is connected to. This program is selective and will require approval from the Head Chef to train.</p>
<p>The <b>River School of Media (RSM)</b> program exists to raise up a new generation of Holy Ghost filled creatives who are anointed to use media as a tool for evangelism, discipleship, and cultural influence. Rooted in the fire of revival, this program empowers students to boldly proclaim the Gospel through film, broadcast, photography, and digital platforms.</p>`},

{ id:"p7", t:"Statement of Faith", n:"7", h:`
<h2 class="ph">STATEMENT OF FAITH</h2>
<p><b>The Scriptures</b> &ndash; The Bible is the inspired Word of God. It is the product of holy men of old who spoke and wrote as they were moved by The Holy Spirit. The new covenant as recorded in the New Testament, we accept as our infallible guide in matters pertaining to conduct and doctrine (II Tim. 3:16, I Thess. 2:13, II Peter 1:21).</p>
<p><b>The Godhead</b> &ndash; Our God is one, but manifested in three persons, the Father, the Son and the Holy Spirit, being co-equal (Phil 2:6). God, The Father, is greater than all: the sender of the Word (LOGOS) and the Begetter (John 14:28, John 16:28, John 1:14). The Son is the Word flesh-covered, the One Begotten, and has existed with the Father from the beginning (John 1:1, John 1:18, John 1:14). The Holy Spirit proceeds forth from both the Father and the Son and is eternal. (John 15:26).</p>
<p><b>Man, His Fall and Redemption</b> &ndash; Man is a created being, made in the likeness and image of God, but through Adam&rsquo;s transgression and fall, sin came into the world. &ldquo;All have sinned and fallen short of the glory of God.&rdquo; As it is written, &ldquo;There is none righteous, no not one.&rdquo; Jesus Christ, the Son of God, was manifested to undo the work of the devil and gave His life and shed His blood to redeem and restore man back to God (Rom. 5:14, Rom. 3:10, Rom. 3:23, I John 3:8). Salvation is the gift of God to man, separate from works and the Law, and is made operative by grace through faith in Jesus Christ, producing works acceptable to God (Eph. 2:8).</p>
<p><b>Eternal Life and The New Birth</b> &ndash; Man&rsquo;s first step toward salvation is godly sorrow that worketh repentance. The New Birth is necessary to all men, and when experienced, produces eternal life (II Cor. 7:10, I John 5:12, John 3:3-5).</p>
<p><b>Water Baptism</b> &ndash; Baptism in water by immersion, is a direct commandment of our Lord, and is for Believers only. The ordinance is a symbol of the Christian&rsquo;s identification with Christ in His death, burial and resurrection (Matt. 28:19, Rom. 6:4, Col. 2:12, Acts 8:36-39). The following recommendations regarding the water baptismal formula is adopted; to wit. &ldquo;On the confession of your faith in the Lord Jesus Christ, the Son of God, and by the authority, I baptize you in the Name of the Father, and the Son and the Holy Ghost. Amen.&rdquo;</p>
<p><b>Baptism in the Holy Ghost</b> &ndash; The Baptism in The Holy Ghost and fire is a gift from God as promised by the Lord Jesus Christ to all Believers in this dispensation and is received subsequent to the New Birth. This experience is accompanied by the initial evidence of speaking in other tongues as the Holy Spirit Himself gives utterance. (Matt. 3:11, John 14:16-17, Acts 1:9, Acts 2:38-39, Acts 19:1-7, Acts 2:4).</p>
<p><b>Sanctification</b> &ndash; The Bible teaches that without holiness no man can see the Lord. We believe in the Doctrine of Sanctification as a definite, yet progressive work of grace, commencing at the time of regeneration and continuing until the consummation of salvation at Christ&rsquo;s return (Heb. 12:14, I Thess. 5:23, II Peter 3:18, Phil. 3:12-14, I Cor. 1:30).</p>
<p><b>Divine Healing</b> &ndash; Healing is for the physical ills of the human body and is wrought by the power of God through the prayer of faith, and by the laying on of hands. It is provided for in the atonement of Christ, and is the privilege of every member of the Church today. (Mark 16:18, James 5:14-15, I Peter 2:24, Matt. 8:17, Isa. 53:4-5).</p>
<p><b>Resurrection of the Just and the Return of Our Lord</b> &ndash; The angels said to Jesus&rsquo; disciples. &ldquo;This same Jesus shall so come, in like manner as ye have seen Him go into heaven.&rdquo; His coming is imminent. When He comes, &ldquo;&hellip;the dead in Christ shall rise first, then we which are alive and remain shall be caught together with them in the clouds to meet the Lord in the air&hellip;&rdquo; (Acts 1:11, I Thess. 4:16-17). Following the Tribulation, He shall return to earth as King of kings and Lord of lords, and together with His saints, who shall be kings and priests. He shall reign a thousand years (Rev. 20:6).</p>
<p><b>Hell and Eternal Retribution</b> &ndash; The one who physically dies in his sins without accepting Christ is hopelessly and eternally lost in the Lake of Fire and therefore has no further opportunity of hearing the Gospel or repenting. The Lake of Fire is literal. The term &ldquo;eternal&rdquo; used in describing the duration of the punishment of the damned in the Lake of Fire carries the same thought and meaning of endless existence as used in denoting the duration of joy and ecstasy of the saints in the presence of God. (Heb. 9:27, Rev. 19:20).</p>`},

{ id:"p8", t:"Statement of Faith", n:"8", h:`
<h2 class="ph">STATEMENT OF FAITH</h2>
<h3>Statement of Final Authority for Matters of Faith/Belief &amp; Conduct:</h3>
<p>The statement of faith does not exhaust the extent of our beliefs. The Bible itself, as the inspired and infallible Word of God, speaks with final authority concerning truth, morality, and the proper conduct of mankind. The Bible is the sole and final source of all that we believe. The River at Tampa Bay Church&rsquo;s senior pastor and the board of directors is the RU&rsquo;s final interpretive authority on the Bible&rsquo;s meaning and application for the purposes of faith, doctrine, practice, policy, and discipline.</p>
<h3>Statement on Marriage, Gender, and Sexuality:</h3>
<p>We believe that God wonderfully and immutably creates each person as male or female. These two distinct, complementary genders together reflect the image and nature of God. (Genesis 1:26-27) Rejection of one&rsquo;s biological sex is a rejection of the image of God within that person.</p>
<p>We believe that the term &ldquo;marriage&rdquo; has only one meaning: the uniting of one man and one woman in a single, exclusive union, as delineated in Scripture. (Genesis 2:18-25) We believe that God intends sexual intimacy to occur only between a man and a woman that are married to each other. (1 Corinthians 6:18; 7:2-5; Hebrews 13:4) We believe that God has commanded that no intimate sexual activity be engaged in outside of a marriage between a man and a woman.</p>
<p>We believe that any form of sexual immorality (including adultery, fornication, homosexual behavior, bisexual conduct, transgenderism, non-binary classification, bestiality, incest, and use of pornography) is sinful and offensive to God. (Matthew 15:18-20; 1 Corinthians 6:9-10)</p>
<p>We believe that in order to preserve the function and integrity of RU, and to provide a biblical role model to all RU students and the community, it is imperative that all persons in service with or in attendance at RU, in any capacity whether paid or as a volunteer, agree to and abide by this Statement on Marriage, Gender, and Sexuality. (Matthew 5:16; Philippians 2:14-16; 1 Thessalonians 5:22)</p>
<p>We believe that God offers redemption and restoration to all who confess and forsake their sin, seeking His mercy and forgiveness through Jesus Christ. (Acts 3:19-21; Romans 10:9-10; 1 Corinthians 6:9-11)</p>
<p>We believe that every person must be afforded compassion, love, kindness, respect, and dignity. (Mark 12:28-31; Luke 6:31). Hateful and harassing behavior or attitudes directed toward any individual are to be repudiated and are not in accord with scripture nor the doctrines of RMI, The River at Tampa Bay Church, RU or RMIMA.</p>`},

{ id:"p9", t:"Campus Facilities", n:"9", h:`
<h2 class="ph">CAMPUS FACILITIES</h2>
<h3>LOCATION</h3>
<p>RU is located on the east side of the city of Tampa, Florida. The facility&rsquo;s address is 3738 River International Drive, Tampa, FL 33610. The campus has easy access to Interstates 75 and 4.</p>
<h3>DESCRIPTION</h3>
<p>RU campus is contained on more than 90 acres of lush foliage and landscape. Its facilities are shared by Revival Ministries International (hereinafter RMI) and the River at Tampa Bay Church. The classrooms and school auditorium are housed within three separate buildings on the campus.</p>
<h3>SAFETY AND SECURITY</h3>
<p>RU has met all local, state, and federal building, health and safety codes. Initial building codes have been completed and sanitation and fire inspections are conducted yearly. Security personnel are a part of the staff of The River at Tampa Bay Church and serve to keep the facility and its contents safe. An on-site custodial staff works to ensure cleanliness.</p>
<h3>PARKING AND TRANSPORTATION</h3>
<p>RU parking area provides ample parking for faculty, staff, and students. The lit parking area contains approximately 1700 parking spaces and surrounds the college.</p>
<p>No disabled vehicle can be kept or left on the RU campus.</p>
<p>No vehicles can be left on the RU campus unattended unless the student is attending a ministry event. A student must be on campus if their vehicle is parked on campus. After one warning, the vehicle will be towed at the owner&rsquo;s expense.</p>
<p>Overnight parking will only be permitted if a student is attending a ministry event and needs to leave a vehicle on the campus. Permission from the Dean and The River at Tampa Bay Church security must be obtained to leave any vehicle on campus parking. Vehicles will be properly allocated and keys must be left with security. After one warning, the vehicle will be towed at the owner&rsquo;s expense.</p>
<h3>PUBLIC TRANSPORTATION</h3>
<p>Tampa has an established public transportation system with regular bus service throughout the city. To obtain more information about public transportation services provided by the City of Tampa, contact Hillsborough Area Regional Transit at (813) 254-4278 or by visiting <a href="https://www.gohart.org" target="_blank" rel="noopener">www.gohart.org</a>.</p>`},

{ id:"p10", t:"Campus Facilities", n:"10", h:`
<h2 class="ph">CAMPUS FACILITIES</h2>
<h3>OFFICE HOURS</h3>
<p>Student hours are 12:30 PM - 1:00 PM Monday - Friday or by appointment for the administration office, Principal, or Dean.</p>
<p>Since RU&rsquo;s office is located in The River at Tampa Bay Church / RMI facility, students will only be allowed access to the office by signing in and obtaining a visitor&rsquo;s badge at the front Reception desk after 1:00 PM or at Student Services from 12:30 PM &ndash; 1:00 PM. The second floor is a secure floor and only authorized personnel are allowed upstairs. Any student found without a proper badge, will be removed from the second floor.</p>
<p>Here are a few things to remember:</p>
<ul>
<li>Student IDs must be worn at all times while on The River at Tampa Bay Church property</li>
<li>Student Services is available during the hours listed above in the announced designated location</li>
<li>Please do not ask questions about RU to the front desk receptionist</li>
<li>Please do not interrupt RU&rsquo;s staff outside of office hours about school related matters</li>
</ul>
<h3>LANGUAGE</h3>
<p>The official language of RU is English. Translation of other languages is not available.</p>
<h3>REASONABLE ACCOMMODATIONS</h3>
<p>Educational opportunities will not be denied to any otherwise qualified individual because of a disability. RU does not discriminate against qualified persons with disabilities. The university will attempt to provide reasonable accommodations as practically possible based on reported disabilities.</p>`},

{ id:"p11", t:"Campus Facilities", n:"11", h:`
<h2 class="ph">CAMPUS FACILITIES</h2>
<h3>YEARLY SCHEDULE</h3>
<p>The school operates on a quarterly schedule.</p>
<table class="qt">
<tr><td>1st quarter: August to October</td><td>3rd quarter: January to March</td></tr>
<tr><td>2nd quarter: October to December</td><td>4th quarter: March to May</td></tr>
</table>
<p>Intake for enrollment for RBI is August and January. All other programs intake only in August.</p>
<p>Each quarter is 8 weeks. The four quarters make up the academic year for the schools. See Academic Calendar for specific dates.</p>
<p>The M.A. in Practical Ministry online program is four sixteen-week semesters spread over two years. The semesters will be held August to December and January to May.</p>
<h3>DAILY SCHEDULE</h3>
<p><b>Bachelor of Arts Class Schedule:</b><br>
Classes are scheduled between the hours of 8:30 AM to 12:30 PM, Monday - Friday. Class schedules are available at the start of each quarter, providing the locations, days and times of classes offered. Labs will require approximately 5 to 10 additional hours per week outside of class time to complete course credits.</p>
<p><b>Master of Arts Class On-Campus Schedule:</b><br>
Fulltime on-campus M.A. students will be in their assigned &ldquo;Practical Ministry&rdquo; department from 9:00 AM &ndash; 1:00 PM, Monday - Friday. Classes are scheduled between the hours of 2:15 PM to 4:30 PM, Monday - Friday. Class schedules are available at the start of each quarter, providing the locations, days and times of classes offered. M.A. students do not have any required Labs.</p>
<p><b>Master of Arts Class Online Schedule:</b><br>
Online M.A. classes are laid out by weekly sessions that you complete at your own pace. Please follow the due dates listed in your online course.</p>
<h3>SCHOOL CLOSINGS</h3>
<p>In the event of an unscheduled closing or class cancellation, the Administrative Office will attempt to contact students and faculty via Populi and other media means as is available. The student is responsible for ensuring their most recent contact information is on file in Populi.</p>
<p>Students may also call the Administrative Office at 813-849-6641 for updated information which will be available on the college answering machine and listed on the Populi news feed. No student will be counted absent for an unscheduled college closing or class cancellation.</p>`},

{ id:"p12", t:"Campus Facilities", n:"12", h:`
<h2 class="ph">CAMPUS FACILITIES</h2>
<h3>OPEN DOOR POLICY</h3>
<p>The Office of the Dean is located in The River at Tampa Bay Church facility. RU strives to maintain an open door policy for its faculty and students. To better assist in serving students, please submit a Meeting Request form to the school office to meet with the Dean, Pastors, or Administrator.</p>
<h3>OBTAINING INFORMATION</h3>
<p>General information about the individual schools can be found at the university website, <a href="https://www.RiverUniversity.org" target="_blank" rel="noopener">www.RiverUniversity.org</a>. This information includes, but is not limited to, application information, general school policies and procedures, course information, academic and class schedules, as well as other pertinent college related materials.</p>
<h3>VISITORS</h3>
<p>All persons visiting the campus are required to register with the school office in advance before they visit in order to properly welcome them and ensure all security protocols are met. Students who desire to bring a guest must fill out a Visitor Request Form for approval. A 24-hour notification with approval from the RU Administrative Office is required before a visitor can sit in a class. On the day of the visit a temporary badge may be picked up from the Student Entrance and must be worn throughout the duration of the visit. Visitors are required to fill out an inquiry card and can only sit in classes for two consecutive days.</p>
<h3>TEXTBOOKS</h3>
<p>Information regarding required reading will be supplied to the students before the beginning of each quarter. Title, author, and ISBN number will be provided in order for students to find and purchase these books from an outside source. There are many online book sources as well as new and used bookstores in the area where students will be able to acquire these books.</p>
<h3>COPY SERVICES</h3>
<p>Copy services are unavailable for students in any of the campus offices.</p>
<h3>STUDENT DINING</h3>
<p>Food and drinks are available for purchase at Kings Arms Coffee located on The River at Tampa Bay Church campus. No food is allowed indoors (i.e., the classrooms including Studio B lobby or the main sanctuary). <b>Bottled water in a transparent container is the only beverage permitted in any classroom or the main sanctuary.</b></p>
<p>Eating is only allowed outdoors.</p>
<p>Kings Arms Coffee will only serve food and beverages to students outside of class times including breaks. Once the warning bell has rung, students must leave the caf&eacute; and return to their classroom. Please note that if a student is at Kings Arms Coffee during class time, they will be marked absent.</p>
<h3>CHILDCARE SERVICES</h3>
<p>Childcare services are available on a first come, first serve basis on campus for students with children between the ages of one and five years old at a nominal charge of $210.00 per month, per child. Any student in need of childcare, must visit the childcare table during registration. There is limited space so please prepare for alternative childcare should you need it. Please see page 21 for more detailed financial information.</p>`},
{ id:"p13", t:"Programs of Study", n:"13", h:`
<h2 class="ph">PROGRAMS OF STUDY</h2>
<p>RU was established to equip men and women to be victorious in every area of life. It is our desire to produce men and women of God who are knowledgeable in the Word of God, strong in faith principles, compassionate to the needs of others, and as bold as a lion! With this goal in mind, RU offers several distinct programs of study. Among these are the River Bible Institute, the River School of Worship, River School of Government, River Culinary Institute and River School of Media.</p>
<h3>RU &ndash; Foundational Year</h3>
<p>RU offers a Foundational Year where students will gain foundational values, knowledge, skills and impartation that will help equip, shape, mold and expand students to become active participants in God&rsquo;s work as it relates to their calling. All students entering RU will participate in the Foundational Year regardless of the program they are accepted into at initial enrollment. During the Foundational Year, each program will offer labs as introductory courses to their selected program that will usher them into their core courses during year two.</p>
<h3>RIVER BIBLE INSTITUTE &ndash; Year Two and Three</h3>
<p>The River Bible Institute is designed for those who would like to pursue an in-depth study of the Bible and experience the glory of God. This program is not just for the full-time minister, but for both new converts and individuals who want to know how to apply the Bible to their daily lives.</p>
<p>The River Bible Institute&rsquo;s year two and three was created as a focused training ground for those who sense a call into the Five-Fold ministry of apostles, prophets, evangelists, pastors, and teachers.</p>
<p>Students enrolled in this program will train for ministry, pursue an intense study of the Bible, enhance their present skills, gain a deeper understanding of the things of God, learn how to better relate to people, and obtain invaluable instruction on Faith, the Holy Spirit, Bible Prophecy and other theological areas.</p>
<p>In the third year, in conjunction with offered courses, students will receive hands-on training from all department heads at The River at Tampa Bay Church to obtain working knowledge of day-to-day operations in a church and ministry setting.</p>
<p>The River Bible Institute program is measured in academic credit hours. Academic credit hours are transferable from one post-secondary institution to another and are subject to the guidelines and restrictions of the post-secondary institution who receives the credits.</p>
<p>Students enrolled in this program who successfully complete all required courses will receive a Bachelor of Arts in Ministry.</p>
<p>Students who meet all graduation requirements and complete this three year program in its entirety may participate in the annual graduation commencement exercises in graduation regalia.</p>`},

{ id:"p14", t:"Programs of Study", n:"14", h:`
<h2 class="ph">PROGRAMS OF STUDY</h2>
<h3>RIVER BIBLE INSTITUTE &ndash; Master of Arts in Practical Ministry</h3>
<p>The Ministry of Arts in Practical Ministry program is a highly selective program designed to further develop and sharpen students&rsquo; giftings while serving in ministry by offering courses created with content that focus on the key messages and material that directly and personally impacted the ministry and lives of the Howard-Browne&rsquo;s. This program represents an impartation of the materials they believe are most crucial to solidifying the students&rsquo; foundation for long-term success in ministry.</p>
<p>This program is exclusive to third year graduates who have received their Bachelor of Arts degree in a respective program and approved by the President of the university. The program content has two delivery methods:</p>
<ul>
<li>On-campus for full-time students</li>
<li>Online for part-time students who are already employed at RMI.</li>
</ul>
<p>The River Bible Institute program is measured in academic credit hours. Academic credit hours are transferable from one post-secondary institution to another and are subject to the guidelines and restrictions of the post-secondary institution who receives the credits.</p>
<p>Students enrolled in this program who successfully complete all required courses will receive a Masters of Arts in Practical Ministry</p>
<p>Students who meet all graduation requirements and complete this three year program in its entirety may participate in the annual graduation commencement exercises in graduation regalia.</p>
<h3>RIVER SCHOOL OF WORSHIP &ndash; Year Two and Three</h3>
<p>The River School of Worship&rsquo;s year two and three program was created as a training ground for those who sense a call into full-time music and worship ministry. Students enrolled in this program will train for positions as worship leader or pastor and develop further skills needed to minister in that vocation.</p>
<p>This program is designed to raise up a new breed of worship leaders, musicians and worshippers to infiltrate our culture and the world with the presence of God. The curriculum was designed with the student in mind who wants to pursue additional studies for a Fivefold ministry or to continue Biblical studies along with their Worship training. It combines the foundational instruction of the River Bible Institute&rsquo;s first year with worship training to give the students a well-rounded, on fire, Holy Ghost experience.</p>
<p>River School of Worship program is measured in academic credit hours. Academic credit hours are transferable from one post-secondary institution to another and are subject to the guidelines and restrictions of the post-secondary institution who receives the credits.</p>
<p>Students enrolled in this program who successfully complete all required courses will receive a Bachelor of Arts in Worship Ministry.</p>
<p>Students who meet all graduation requirements and complete this three year program in its entirety may participate in the annual graduation commencement exercises in graduation regalia.</p>`},

{ id:"p15", t:"Programs of Study", n:"15", h:`
<h2 class="ph">PROGRAMS OF STUDY</h2>
<h3>RIVER SCHOOL OF GOVERNMENT &ndash; Year Two and Three</h3>
<p>The River School of Government was established to raise-up men and women, full of the Holy Ghost, who will govern according to solid Godly principles and who will faithfully defend the individual rights and freedoms that are guaranteed by both the Constitution and God&rsquo;s Word. Its goal is not to produce career politicians, who will abuse their position for personal gain or for personal power, but to inspire tomorrow&rsquo;s leaders to honor and stand up for the integrity of both the Constitution and God&rsquo;s Word and bring America back to her founding principles.</p>
<p>The River School of Government program is measured in academic credit hours. Academic credit hours are transferable from one post-secondary institution to another and are subject to the guidelines and restrictions of the post-secondary institution who receives the credits.</p>
<p>Students enrolled in this program who successfully complete all required courses will receive a Bachelor of Arts in Biblical Governance.</p>
<p>Students who meet all graduation requirements and complete this three year program in its entirety may participate in the annual graduation commencement exercises in graduation regalia.</p>
<h3>RIVER CULINARY INSTITUTE &ndash; Year Two and Three</h3>
<p>The River Culinary Institute was established for the purpose of training men and women in Culinary to work in and with the Hospitality Industry and every realm it is connected to. Whether it is to establish a world class hospitality department in their local church, start a Kingdom Business in the Hospitality sector or to use their knowledge as a platform to reach into local communities to preach the Gospel of Jesus Christ - the River Culinary Institute is determined to train well-rounded graduates in their practical skill and also in Ministry.</p>
<p>The River Culinary Institute program is measured in academic credit hours. Academic credit hours are transferable from one post-secondary institution to another and are subject to the guidelines and restrictions of the post-secondary institution who receives the credits.</p>
<p>Students enrolled in this program who successfully complete all required courses will receive a Bachelor of Arts in Christian Culinary Arts.</p>
<p>Students who meet all graduation requirements and complete this three year program in its entirety may participate in the annual graduation commencement exercises in graduation regalia.</p>`},

{ id:"p16", t:"Programs of Study", n:"16", h:`
<h2 class="ph">PROGRAMS OF STUDY</h2>
<h3>RIVER SCHOOL OF MEDIA &ndash; Year Two and Three</h3>
<p>The River School of Media is a hands-on, immersive training ground for the next generation of digital evangelists. Designed as a 3-year program under River University and the leadership of Drs. Rodney and Adonica Howard-Browne, this school equips students with the spiritual foundation, technical skills, and creative vision needed to use media as a tool for the Gospel. Students are trained in areas such as film production, live broadcast, lighting, audio, photography, editing, storytelling, and emerging technologies like artificial intelligence (AI)&mdash;all while staying rooted in the power and presence of God. Revival is not just a subject here; it&rsquo;s the atmosphere students learn in.</p>
<p>The program is structured around a full academic schedule, including credit hours that may be eligible for transfer to other post-secondary institutions. Transferability of credits is not guaranteed and is subject to the receiving institution's guidelines and acceptance policies. Students are encouraged to consult with prospective schools if planning to continue their education elsewhere. The River School of Media is more than a classroom&mdash;it&rsquo;s a movement of creative revivalists, trained and ready to broadcast the Gospel with excellence, innovation, and anointing.</p>
<p>Students enrolled in this program who successfully complete all required courses will receive a Bachelor of Arts in Christian Media and Productions.</p>
<p>Students who meet all graduation requirements and complete this three year program in its entirety may participate in the annual graduation commencement exercises in graduation regalia.</p>`},

{ id:"p17", t:"Admissions and Registration", n:"17", h:`
<h2 class="ph">ADMISSIONS AND REGISTRATION</h2>
<h3>GENERAL ADMISSIONS</h3>
<p>RU is an equal opportunity Christian educational institution which admits qualified applicants regardless of gender, ethnic group, age, handicap status, or veteran status.</p>
<p>A qualified applicant is described as a person who meets the following general admissions requirements along with the specific requirements for the program that he/she will pursue. RU reserves the right to admissions. Each applicant must meet the general admissions requirements as follows:</p>
<ol>
<li>At least 18 years of age.</li>
<li>Complete an application for the selected RU course of study.</li>
<li>Submit a recent passport type photo for identification purposes with the completed application.</li>
<li>Submit official high school transcripts or GED. Submit official college transcripts (if applicable).</li>
<li>If requested, present evidence of good physical and mental health.</li>
<li>If requested, submit a physical examination report including immunizations and drug screening.</li>
<li>Have adequate means of paying his/her tuition (if applicable) and fees as the school does not accept federally funded financial aid, grants or student loans at this time.</li>
<li>Have adequate financial support outside the cost of tuition and fees.</li>
<li>Must have housing in place.</li>
<li>Spouses must relocate and live together to attend school.</li>
<li>Properly complete ALL required admissions paperwork.</li>
<li>Attend the student orientation and be prepared to pay the General Fee in full.</li>
<li>Progression is dependent on maintaining a 2.0 GPA or better in all courses for 1st year, 2.8 GPA for 2nd and 3rd year and 3.0 GPA for 4th year students.</li>
</ol>
<p class="note"><b>PLEASE NOTE:</b> All non-resident aliens must apply through the RMI&rsquo;s Missionary Program. Please email <a href="mailto:missionary@revival.com">missionary@revival.com</a>.</p>
<p class="note"><b>PLEASE NOTE:</b> The M.A. in Practical Ministry is a separate application sent to you by leadership selection. You must be a graduate of River University with a Bachelor of Arts in an approved RU program.</p>
<p class="note"><b>PLEASE NOTE:</b> RU reserves the right of admission.</p>`},

{ id:"p18", t:"Admissions and Registration", n:"18", h:`
<h2 class="ph">ADMISSIONS AND REGISTRATION</h2>
<h3>APPLICATION FOR ADMISSIONS</h3>
<p>To apply for entrance into RU, the following actions are required:</p>
<ol>
<li>Complete the online Application for Admissions and submit it with a non-refundable application fee of $50.00 for Bachelors in Arts programs and $25.00 for Master of Arts program.</li>
<li>Students who are utilizing a payment plan for tuition/fees must complete a Financial Agreement Form. (Payment Plans are only authorized by the RU Administrator.)</li>
<li>Students wishing to receive academic credit for previous schooling must have an official transcript sent to the Office of Admissions. The student is responsible for all fees relating to the acquisition of transcripts (See Fees). Transcript request forms are available upon request.</li>
<li>After submitting their completed application, new students may be required to have a pre-admission interview with a school staff member.</li>
<li>Applications are valid for 12 months. Students who have been accepted, but are prevented from attending the current school year, may postpone their enrollment for up to 12 months. After 12 months students must reapply. (See Fees)</li>
</ol>
<p>The application can be found at <a href="https://www.RiverUniversity.org" target="_blank" rel="noopener">www.RiverUniversity.org</a>.</p>
<p>Once all necessary information has been submitted, the pre-admission interview has been conducted (if applicable), and the student has been accepted, the student may then attend orientation and register for classes.</p>
<h3>REGISTRATION/ENROLLMENT</h3>
<p>Registration is held twice per academic year at the start of classes in August and in January for RBI. All other programs have an August intake. Students must complete all admissions requirements prior to registration. During registration, students are provided with their student ID #, given access to Populi, enrolled into their classes/labs, and finances are settled.</p>
<h3>REVIVAL WEEK</h3>
<p>Revival Week is mandatory for all students and is considered class time. Students from around the world will join Dr. Rodney Howard-Browne for a week of revival to start off the new academic year with the fire of God and the Anointing that will prepare students to receive all that God has for them throughout the school year.</p>
<h3>ORIENTATION</h3>
<p>Orientation is mandatory for all students. Orientation is designed to acquaint the student with the objectives, plan, and purpose of RU and to discuss the college administrative policies and procedures.</p>`},

{ id:"p19", t:"Admissions and Registration", n:"19", h:`
<h2 class="ph">ADMISSIONS AND REGISTRATION</h2>
<h3>RE-ENROLLMENT AND INTERRUPTED EDUCATION</h3>
<p>Students who leave in good standing may reapply for active status at a later date. If a student violates or varies from the standards set by the school or Revival Ministries International as a whole, RU reserves the right to revoke any such student&rsquo;s degree. Any student having an outstanding balance will be prohibited from readmission to this institution until all accounts are settled. Any student who has been expelled from school for disciplinary reasons will be denied readmission until approval has been granted by the President of the college.</p>
<p>Students in good standing who desire to return to school after a 12 months absence or after interrupted education need to complete a student application online, resolve any unpaid balances and pay any other fees required for the current academic year they are re-enrolling into.</p>
<h3>TRANSFER STUDENTS</h3>
<p>Students transferring to RU from another fully accredited college will be expected to follow the same admission requirements as other students who are enrolling for the first time. In addition to completing all required forms, the transfer student may submit official transcripts from the college previously attended.</p>
<p>RU will accept credits from those institutions accredited by one of the accrediting agencies/commissions recognized by the school. In general, credits considered for transfer must be Bible/Theology courses. However, we reserve the right to deny credit for specific courses. The receipt and evaluation of a total transfer credit are the responsibility of the Registrar&rsquo;s Office. No credit is given for any course with less than a &ldquo;B&rdquo; level grade.</p>
<p>Transfer credits should be submitted to the Registrar&rsquo;s Office during the application process. An administrative fee will be charged for credit transfers (See Fees). No transfer credit requests will be considered following the second full week of classes.</p>
<p>Transferred credits from accredited post-secondary schools will be reviewed in accordance with present guidelines and program curricula. The student will be notified regarding the results of the transcript reviews.</p>
<p class="note"><b>PLEASE NOTE:</b></p>
<ul>
<li>No transfer credits are awarded toward the Foundational Year.</li>
<li>Up to 48 credits will be granted toward any Bachelor of Arts degree.</li>
</ul>
<p>In accordance with federal law, records cannot be released without the written consent of the student.</p>
<h3>CHANGE OF SCHOOL</h3>
<p>Students who desire to change from one program of study to another must fill out a Change of School Request Form within the Foundational Year and it will be reviewed by the Administrative Offices of RU. The final decision will be made from the Dean&rsquo;s office with the approval of the lead instructor of the desired program. Please note that credits do not transfer from one program to another and require a restart for each change request for students in 2nd and 3rd year.</p>`},

{ id:"p20", t:"Admissions and Registration", n:"20", h:`
<h2 class="ph">ADMISSIONS AND REGISTRATION</h2>
<h3>AUDITING RU COURSES</h3>
<p>Auditors are not officially classified as students; however, they participate in RU classes, uphold the same student conduct obligations without the requirement of grades or academic credit. An auditor will have a &ldquo;student&rdquo; identifier on Populi; however their enrollment status in class rosters will be labeled &ldquo;Auditor&rdquo;.</p>
<p>Auditors are required to pay their tuition in advance to attend class since they are not full-time enrolled students and are not eligible for the RU scholarship.</p>
<p>A transcript of audited courses can be produced. Auditors typically audit courses to further their knowledge of a subject without the requirement of an academic record.</p>
<p>Auditing of RU courses is only available for the Foundational Year.</p>
<p>Participants of RMI&rsquo;s Missionary Program are not eligible to be auditors.</p>
<p>To ensure the integrity of classroom instruction and minimize the possibility of disruption, auditors are expected to attend all classes and conduct themselves in a manner in compliance with the student handbook for enrolled students and consistent with course requirements as established by the course syllabus. Failure to do so could result in dismissal, not only from course instruction, but also from any and all RU attendance.</p>`},

{ id:"p21", t:"Financial Information", n:"21", h:`
