{ id:"p22", t:"Financial Information", n:"22", h:`
<h2 class="ph">FINANCIAL INFORMATION</h2>
<h3>TUITION AND FEE PAYMENTS</h3>
<p>Students are responsible to keep accounts current. Students whose accounts are not paid by established due dates may not attend class any day thereafter until tuition/fee payment is made in full or communication has been made with the Administration Office for other arrangements.</p>
<p>Cash, money orders, personal checks, traveler&rsquo;s checks, cashier&rsquo;s checks, church checks, ministry checks, business checks, and Visa, MasterCard, American Express, and Discover credit cards for the amount of the tuition payment are accepted. Payments made by credit or debit cards can be made through Populi.</p>
<p>Students who have sponsors paying their tuition/fees are responsible for keeping their sponsors informed of financial responsibilities and due dates. It is also the student&rsquo;s responsibility to check with sponsors or the Administrative Office to verify payment. Tuition/fees must be paid during normal Administration&rsquo;s Office hours on or before the payment due date.</p>
<h3>FINANCIAL ASSISTANCE</h3>
<p>At this time, RU does not offer any student loans, grants, or other financial assistance. Students are responsible for all costs. Payment installments are available to assist the student with tuition/fee payments.</p>
<p>Scholarships are available. Any scholarships offered are at the discretion of the President of RU. Students who receive a scholarship must follow scholarship guidelines and will be evaluated each quarter on an individual basis.</p>
<p>RU does not accept, participate in nor seek eligibility for federal financial aid. PELL Grants, GI Bill, and Federal Student Loans are not accepted as methods for payment of RU tuition or fees.</p>
<h3>CHILDCARE FEES</h3>
<p>Revival Ministries International offers childcare to students who have children between the ages of one and five years old. The cost for childcare during school sessions is $210.00 per month, per child. Payment must be submitted to the RU Administrative Office. Childcare is a privilege and should be treated as such. Childcare fees must be paid in advance or childcare services will be suspended. Invoices will be sent out via the RU Office. A receipt will be issued at the time of each payment for personal financial records. Cash, check and credit cards are accepted. The same financial policy that is used in RU for bounced checks and declined credit cards will be applied for childcare.</p>`},

{ id:"p23", t:"Financial Information", n:"23", h:`
<h2 class="ph">FINANCIAL INFORMATION</h2>
<h3>RETURNED CHECK POLICY</h3>
<p>If a check is returned from the bank because of insufficient funds, the student will receive a letter from the Administration Office of RU. No additional checks can be written to the college until all monies, including the $25.00 returned check fee have been paid. A student may also be subject to disqualification from enrollment until all outstanding monies have been paid. If a student has accumulated a total of three (3) returned checks, that student will not be permitted to write any checks to RU.</p>
<h3>REFUND POLICY</h3>
<p>A refund will be provided under the following conditions:</p>
<ul>
<li>A student has completed the necessary withdrawal form and returned it to the Administrative Office during the second week of class. This is two weeks from the initial quarter start date as listed on the RU Academic Calendar.</li>
<li>The student is in good standing at the time of withdrawal.</li>
<li>The student is not leaving due to disciplinary action that has been taken or will be taken against him/her.</li>
<li>The student has no outstanding balance.</li>
</ul>
<p>Any student who withdraws from the institution and does not complete the proper withdrawal procedures (returned the required withdrawal form) is responsible for all tuition costs and fees.</p>
<p>Withdrawal forms are only available from an Academic Advisor.</p>
<p>Once the proper withdrawal procedures are completed, a full refund of all monies paid will be provided.</p>
<p>The first week of classes begins on the quarter start date as listed on the RU Academic Calendar regardless of when the student begins attending.</p>
<p>This refund policy only applies to students who have completed the proper withdrawal forms.</p>
<p>Please allow thirty days for any refund.</p>`},

{ id:"p24", t:"Academic Information", n:"24", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>STUDENT CLASSIFICATION</h3>
<p>Once an applicant has matriculated in RU he or she will be classified as one of the following:</p>
<h4>Active Student</h4>
<p>Active Student is a student who is actively matriculated in the college, is enrolled in classes and is seeking a degree from RU. Degree seeking students must complete all supplemental registration forms and have a preadmission interview with the Dean of RU, if applicable.</p>
<h4>Inactive Student</h4>
<p>Inactive Student is a student who has been enrolled at one time, but has not attended classes for at least one quarter during an academic year, or has withdrawn from RU. An &ldquo;inactive student&rdquo; who was withdrawn will have their Populi &ldquo;student role&rdquo; and user login removed.</p>
<p>Inactive Student is also a student who has successfully graduated but are allowed to keep their user login.</p>
<h4>Auditor</h4>
<p>Auditors are not officially classified as students; however, they participate in RU classes, uphold the same student conduct requirements without the requirement of grades or academic credit. An auditing student will have a &ldquo;student&rdquo; identifier on Populi; however their enrollment status will be labeled &ldquo;Auditor&rdquo;.</p>`},

{ id:"p25", t:"Class Attendance &amp; Tardiness", n:"25", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>CLASS ATTENDANCE &ndash; On Campus Students</h3>
<p>To ensure the best possible result from the school programs, students are encouraged to attend all class sessions for the courses in which they are enrolled.</p>
<p>Excessive absences may adversely affect the student&rsquo;s grade, may lead to failure of the course and/or automatic withdrawal.</p>
<p>It is the responsibility of the student to complete all course work assigned during the period of absence.</p>
<ol>
<li><b>Class Absences</b> - During each academic quarter, the maximum number of class absences permitted is four full days. These allowances are for extreme circumstances and emergencies only.</li>
<li><b>Excessive Class Absences</b> - If you exceed the allowed class absences, you may be permitted to attend classes, although you may forfeit any credit hours for the quarter. Excessive class absences affect a student&rsquo;s scholarship status. <b>Any student on scholarship that has five or more class absences will forfeit their academic scholarship.</b></li>
<li><b>Class Attendance Violations</b> - Students are allowed four (4) class absences per quarter before any action is taken. Once a student exceeds their four (4) allowable class absences, they will receive an &ldquo;Attendance Warning&rdquo; in their Populi student profile. Students who continue to be absent after the warning has been issued will be required to meet with an Academic Advisor and placed on &ldquo;Attendance Probation&rdquo; and noted on their Populi student profile. If excessive class absences are not resolved after this meeting, the Dean will make a decision on the continuation of the student&rsquo;s matriculation.</li>
<li>Any student absent for five (5) consecutive days with no communication is subject to automatic withdrawal by the college.</li>
<li>Attendance is taken by each student checking in through the method provided by the school. Training will be provided at orientation. Failure to check in to the class will be deemed an absence.</li>
<li>Anyone checking in for another student will be subject to immediate dismissal.</li>
<li>Once a class has begun, students must remain in their seat until the instructor dismisses the class. Only in the case of extreme emergencies should students leave their seat. If a student leaves early, the student is marked tardy.</li>
<li>Employment that interferes with class time is not allowed and will not constitute as a reason for an excused absence.</li>
</ol>
<h3>TARDINESS &ndash; On Campus Students</h3>
<p>Punctual class attendance is expected of all students of RU. Classes will start promptly at the scheduled time. It is imperative that each student arrive to class on time and be seated before the start of each class session. Students are to remain in the classroom for the entire class period. A two minute warning bell will sound indicating that it is time for students to check-in to their current class session before they are marked tardy.</p>
<p>Students who are late by more than ten (10) minutes will be considered absent and may not be able to enter class. Students who check-in after the class period begins or leave early will be marked tardy. Accumulation of four tardy marks will be counted as one absence.</p>`},

{ id:"p26", t:"Attendance", n:"26", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>CLASS ATTENDANCE &ndash; Online Students (M.A. Online Program Only)</h3>
<p>To ensure the best possible result from the Master of Arts in Practical Ministry online program (4th year students only), students are encouraged to login on a weekly basis into the courses in which they are enrolled. All courses are taught in asynchronous learning formats. Asynchronous activities are those that students can connect to at any time to complete tasks by the due dates set by the course instructor.</p>
<h3>CHURCH SERVICE ATTENDANCE &ndash; All Students</h3>
<p>Students are required to attend The Main Event on Sunday morning, Sunday evening and Wednesday evening services. Students are encouraged to attend all church services and attendance will be taken.</p>
<ol>
<li><b>Service Absences</b> - During each academic quarter, the maximum number of service absences permitted is four services. These allowances are for extreme circumstances and emergencies only.</li>
<li><b>Service Attendance Violations</b> - Students are allowed four (4) service absences per quarter before any action is taken. Once a student exceeds their four (4) allowable service absences, they will receive a notification to meet with the Dean. If excessive absences are not resolved after this meeting, the Dean will make a decision on indoor suspension and/or the continuation of the student&rsquo;s matriculation.</li>
<li><b>Excessive Service Absences</b> - If you exceed the allowed absences, you may be permitted to attend services, although you may forfeit your eligibility to graduate.</li>
<li>Attendance is taken by each student checking in through the method provided by the school. Training will be provided at orientation. Failure to check in to the class will be deemed an absence.</li>
<li>Anyone checking in for another student will be subject to immediate dismissal.</li>
<li>It is the responsibility of the student to arrive on time to services, check-in, and stay for the entirety of the service to ensure their attendance is counted.</li>
</ol>`},
{ id:"p27", t:"Attendance Requirements", n:"27", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>ACADEMIC ATTENDANCE REQUIREMENTS &ndash; ALL SCHOOLS</h3>
<h4>CLASS ATTENDANCE</h4>
<p>Attendance is required during all class times, Monday through Friday, 8:30 AM to 12:30 PM. Chapel and announcements are considered part of class time and are mandatory.</p>
<p>Labs are considered class time and attendance is taken for every lab. Labs are scheduled throughout the week and require approximately 5 to 10 additional hours per week outside of class time to complete course credits.</p>
<h4>Service Attendance</h4>
<p>Students are required to attend The Main Event on Sunday morning, the Sunday evening and the Wednesday evening services. Students that attend a local home church within the area (40 miles radius or less) must provide proper documentation as required by the UNITE Department from their home pastor that they are attending Sunday morning to be excused from The River at Tampa Bay Church&rsquo;s Main Event. Home church students are required to attend The River at Tampa Bay Church for the Sunday evening and Wednesday evening services. Please refer to your MOH documents from registration for further information.</p>
<p class="note"><b>PLEASE NOTE:</b> All students and auditors must attend The River at Tampa Bay Church as their home church unless a specific exception has been granted. Attending services at The River at Tampa Bay church does not make you a member.</p>
<h4>Church Membership</h4>
<p>Being a student at RU does not automatically grant you membership of The River at Tampa Bay Church. Students are not required to become a member of the church during their tenure at RU. However, we encourage you to become a member; therefore, students seeking membership will have to complete &ldquo;The River at Tampa Bay Church Membership Journey&quot;. To do so, please complete the membership form at <a href="https://revival.com/membership" target="_blank" rel="noopener">revival.com/membership</a>.</p>
<h4>Special Event Attendance</h4>
<p>Students are required to attend and serve at all Special Events hosted by the ministry and attendance is considered class time. These include but are not limited to: Revival Week, Fall and Spring Ministers&rsquo; and Leaders&rsquo; Conferences, Winter Campmeetings, Men and Women&rsquo;s Conferences, Turkey Giveaway, Toy Giveaway, Easter, and other mandatory services as listed in the student handbook and academic calendar and/or any other Outreach events occurring at The River at Tampa Bay Church. This includes attending on Saturday services during conferences and campmeetings. Failure to attend these special events will constitute grounds for probation, suspension, or other administrative action.</p>
<p class="note"><b>PLEASE NOTE:</b> Students are not to approach, engage, exchange contact information or attempt to network with Pastor&rsquo;s special guests on or off property or via social media.</p>
<h4>Attendance Requests for the River School of Healing</h4>
<p>Healing School is a ministry of The River Church at Tampa Bay for those seeking divine healing from terminal diseases. It is not a credit course offered at RU. It is the policy of RU that students who desire to attend the River School of Healing should do so before or after the academic year unless you fall in the category of terminally ill, God forbid this should ever be the case.</p>`},

{ id:"p28", t:"Academic Requirements &mdash; Labs", n:"28", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>ACADEMIC REQUIREMENTS - LABS (for B.A. On Campus Programs)</h3>
<h4>Soul Winning Lab</h4>
<p>All students are required to attend and participate in one soul winning training per week for a total of eight Soul Winning Labs per quarter. Students must record attendance at all soul winning labs using the means provided. Students are also required to attend Super Soul-winning Saturdays (S.S.S.) which are scheduled once a month. Please refer to the Soul Winning Lab Syllabus for S.S.S. dates and further information.</p>
<h4>Call Center Lab</h4>
<p>All first year students will be required to attend and participate in one call center lab every week for a total of eight call center labs per quarter. Students must record attendance at all Call Center labs using the method provided for the scheduled shift. Students are required to schedule their call center shifts using Planning Center Online. Please refer to the Call Center Syllabus and Call Center Guidelines for shift options, schedule times and further information.</p>
<h4>Academic Excellence Lab</h4>
<p>First year students that need additional assistance in academic matters will be enrolled into the Academic Excellence Lab in lieu of the Call Center Lab. Students will participate in one lab every week for a total of eight labs per quarter. Students must record attendance at the Academic Excellence Lab classroom using the method provided for by the instructor. Students are required to schedule their Academic Excellence Lab study time using Planning Center Online. Please refer to the Academic Excellence Lab Syllabus for schedule availability and further information.</p>
<h4>Ministry of Helps Practicum</h4>
<p>All second and third year students must serve in the Ministry of Helps (MOH) department assigned to them by UNITE every other Sunday and one week-night at The Stand at The River at Tampa Bay Church every other week. These will alternate so that it totals eight services in which a student will serve per quarter. Please refer to the MOH Lab Syllabus for further information.</p>
<p>Students who do not attend The River at Tampa Bay Church as their home church must have their pastor complete a MOH Home Church Verification form. These forms are available from the UNITE department to verify that each student is serving regularly in a helps ministry at their home church on Sunday mornings. These forms must be submitted at enrollment/registration to the UNITE department. Please note that students with a Home Church other than The River at Tampa Bay Church are still required to serve one week-night at The Stand every other week in addition to serving at their home church on Sunday mornings.</p>`},

{ id:"p29", t:"Academic Requirements by School", n:"29", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>ACADEMIC REQUIREMENTS &ndash; RIVER BIBLE INSTITUTE</h3>
<h4>Ministry Service Practicum</h4>
<p>The Ministry Service Practicum (MSP) is a RBI lab designed to assist students in the process of focusing their educational and spiritual goals while pursuing a degree in ministry at RU. Students will experience various ministry departments each week after class hours to receive a well-rounded education as to how a successful ministry should flow and function. Therefore, second and third year RBI students will be assigned a MSP department each semester. Please refer to the MSP Lab Syllabus for further information.</p>
<h3>ACADEMIC REQUIREMENTS &ndash; RIVER SCHOOL OF GOVERNMENT</h3>
<h4>Public Service Practicum</h4>
<p>The Public Service Practicum (PSP) is a River School of Government lab where students meet each week to discuss political events, and attend local political and government functions to gain experience in the practical side of public service and political activity. Please refer to the PSP Syllabus for further information.</p>
<h3>ACADEMIC REQUIREMENTS &ndash; RIVER SCHOOL OF WORSHIP</h3>
<h4>Music Lab</h4>
<p>The Music Lab is an opportunity for River School of Worship students to develop their singing/playing skills in their area of primary gifting. The lab gives students time each week for practice and skill development using guided self-study. Please refer to the Music Lab Syllabus for further information.</p>
<h3>ACADEMIC REQUIREMENTS &ndash; RIVER CULINARY INSTITUTE</h3>
<h4>Culinary Lab</h4>
<p>The Culinary Lab lays a foundation for students to improve their culinary skills, importance of safety, sanitation and knife skills. The lab gives students dedicated time in a professional kitchen each week to practice, develop and hone their culinary skills to restaurant standards. Please refer to the Culinary Lab Syllabus for further information.</p>
<h3>ACADEMIC REQUIREMENTS &ndash; RIVER SCHOOL OF MEDIA</h3>
<h4>Media Lab</h4>
<p>The Media Lab provides hands-on experience in media production, including filmmaking, sound engineering, photography, live television broadcasting, graphic design and podcasting. Designed to equip students with practical skills, the Media Lab emphasizes creative storytelling, technical proficiency, and alignment with impactful messaging for the purpose of winning souls around the globe. Students will create media projects that integrate multiple disciplines to uphold industry standards in a ministry environment.</p>
<p class="note"><b>PLEASE NOTE:</b> M.A. of Arts program does not have any lab requirements.</p>`},

{ id:"p30", t:"Academic Advisement &amp; Grading", n:"30", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>ACADEMIC REQUIREMENTS</h3>
<p>It is the desire of RU to see each student achieve and perform at his/her highest level academically. The school is committed to providing academic programs and services to assist the student in the learning process. However, the student bears the responsibility for their own personal academic success.</p>
<p>Excessive absenteeism, failure to complete the required course work, lack of preparation for class, and a disregard for the rules and regulations of this school can all lead to failure in one form or another. All students must maintain satisfactory progress in order to continue as an active student in any programs of study.</p>
<h3>ACADEMIC ADVISEMENT</h3>
<p>Every active student in RU has access to an Academic Advisor who will communicate with the student throughout the academic school year. Students who would like academic assistance with educational direction, continuing education, or counseling must complete a Meeting Request Form whereupon the RU Administrative Office will forward that request to an advisor. Academic advising is available for home church students. However, home church students must receive pastoral counseling at their home church.</p>
<p>The following is a non-exhaustive list of some of the topics that are addressed by an Academic Advisor:</p>
<ol>
<li>Help students recognize and achieve their educational and spiritual goals.</li>
<li>Encourage students to apply academic focus as they pursue and complete their academic requirements.</li>
<li>Assist students with student-life balance to ensure they fulfill their fullest potential.</li>
<li>Motivate students to develop a sense of community among peers, faculty, and members of the local church, The River Church at Tampa Bay.</li>
<li>Meet and counsel students who request to withdraw to ensure they are making the best decision.</li>
<li>Counsel students who are failing in their studies to identify other causes than just academic hindrances and assist in developing a plan for success.</li>

{ id:"p31", t:"Matriculation &amp; Discipline", n:"31", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>MATRICULATION REQUIREMENTS</h3>
<p>Students must maintain a minimum 2.00 grade point average (GPA) in their 1st year, 2.80 GPA for their 2nd and 3rd years, and 3.00 GPA for their 4th year in any quarter while actively enrolled and matriculated.</p>
<p>A course receiving a final grade of &ldquo;F&rdquo; is considered a failing grade. If a student receives a failing grade, they will not obtain credit for that individual course and must seek a remedial action plan as listed in the policy below.</p>
<h3>ACADEMIC DISCIPLINARY PROCEDURE</h3>
<p>Any student who has not maintained the required GPA for a given quarter will be subject to the following academic disciplinary measures:</p>
<p>An <b>Academic Warning</b> is issued at the end of the first full quarter to a full time degree-seeking student who has not maintained the required minimum GPA or has one failing grade. The Academic Warning will serve as a written notification to the student of the consequences which may occur if unsatisfactory grades continue. The student will be required to pay the tuition for the failed course with no success plan.</p>
<p>An <b>Academic Probation</b> is the next step taken if the student&rsquo;s GPA remains below the minimum requirement for two consecutive quarters or has two failing grades. The following probation procedures apply to students enrolled who fall below the matriculation requirements: The student will be informed by the school administration that they have been placed on Academic Probation. The student will be required to meet with the Dean of RU, an Academic Advisor and/or the RU Administrator to discuss the reasons surrounding the continued unsatisfactory grades. The student will be counseled and provided with steps for bringing his/her grades up to an acceptable level by developing a remedial action plan. The student will be given a predetermined amount of time to correct the academic deficiency. The student&rsquo;s permanent file will be noted and will be required to pay the tuition for the failed course(s).</p>
<p>An <b>Academic Suspension</b> is the final step in the academic disciplinary process. Any student whose GPA remains below the required minimum at the end of three consecutive quarters or has multiple failing grades will be informed by the school administration that they have been placed on Academic Suspension. The student will be asked to report to the Dean of RU and he/she will be suspended for a length of time that will be determined by the Dean. Counseling will be available during the period of suspension.</p>
<p>RU reserves the right to terminate a student&rsquo;s matriculation who is placed on academic warning, probation, or suspension.</p>
<p>Three &ldquo;F&rsquo;s&rdquo; in a B.A. program within a year will result in a student&rsquo;s dismissal from RU and the student is ineligible for a refund of tuition or fees.</p>
<p>One &ldquo;F&rdquo; in a M.A. program within a year will result in a student&rsquo;s dismissal from RU and the student is ineligible for a refund of tuition or fees.</p>
<p>The student may appeal the academic suspension by submitting a written letter in a sealed envelope to the Dean of RU. The Dean of RU will confer with the President of the school before a final ruling. The student will be notified in writing about the results of the appeal.</p>
<p>The decision handed down by the President of the governing board is final.</p>`},

{ id:"p32", t:"Scholarship Requirements", n:"32", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>ACADEMIC REQUIREMENTS FOR STUDENTS ON SCHOLARSHIP</h3>
<p>First year B.A. students on academic scholarship must maintain a minimum 2.00 cumulative grade point average (GPA). Second and third year B.A. students on academic scholarship must maintain a minimum 2.80 cumulative grade point average (GPA). M.A. students on academic scholarship must maintain a minimum 3.00 cumulative grade point average (GPA).</p>
<h3>Scholarship Warning</h3>
<p>A Scholarship Warning will be given to any student on scholarship that does not maintain the required minimum scholarship GPA in any quarter enrolled. The Scholarship Warning will serve as written notification to the student of the consequences which may occur if the unsatisfactory grades continue. Any student receiving a Scholarship Warning will have one quarter to correct the academic deficiency. The scholarship will be retained if the student regains the minimum GPA.</p>
<h3>Scholarship Forfeiture</h3>
<p>Any student on scholarship that is below the minimum scholarship GPA for two consecutive quarters will forfeit the academic scholarship.</p>
<p>A course receiving a final grade of &ldquo;F&rdquo; is considered a failing grade. Failed courses forfeit the financial coverage afforded by the RU Scholarship. If a student receives a failing grade, they will not obtain credit for that individual course. The student will be charged full tuition for the full credit hours of each failed course.</p>`},

{ id:"p33", t:"Withdrawal Procedures", n:"33", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>WITHDRAWAL PROCEDURES</h3>
<p>Once a student has been admitted to school, that student is considered matriculated but not active. If a matriculated student does not enroll, the Admissions department will withdraw their matriculation.</p>
<p>Once a student is enrolled into courses, that student is considered actively enrolled. Therefore, if the student desires to withdraw from the program, he/she must comply with the following withdrawal procedure to be considered in &ldquo;good standing&rdquo; should he/she decide to reapply.</p>
<p>&ldquo;Good Standing&rdquo; is defined as but not limited to the following:</p>
<ul>
<li>Met in-person to discuss withdrawal</li>
<li>No outstanding balances</li>
<li>No academic violations</li>
<li>No disciplinary violations</li>
</ul>
<ol>
<li>The student must communicate with an Academic Advisor and have an &ldquo;in-person&rdquo; meeting with them to request a Withdrawal Form.</li>
<li>The student will be provided with an opportunity to explore alternative options which may remove the need for the withdrawal. If an alternative can be agreed upon, the student may repeal the withdrawal and continue in the program.</li>
<li>If an alternative cannot be agreed upon, the withdrawal process will continue.</li>
<li>The Withdrawal Form must be completed with an Academic Advisor. The withdrawal is not deemed complete until the form is signed by the student and returned to the School Administrative Office. The student will be held liable for all outstanding tuition charges and fees.</li>
<li>The student will meet with the Administrator who will review the student&rsquo;s file to see if the student is in good standing with the institution and check for any outstanding tuition or other fees. All outstanding tuition and fees must be settled or satisfactory payment arrangements made at the time of withdrawal.</li>
<li>The Administrator or Academic Advisor will collect all campus access items, i.e., ID badge, parking pass, etc.</li>
<li>If a student has no outstanding balance, he/she is allowed to complete the withdrawal process.</li>
<li>If a student is owed a refund, the refund will be given based on the guidelines listed under the Refund Policy in this handbook.</li>
</ol>
<h3>WITHDRAWAL &ndash; GOOD STANDING</h3>
<p>If a student in good standing withdraws voluntarily prior to the end of the current quarter, the student will receive a (W) Withdrawal on his/her academic report and transcript. No other grade will be given. The course must be re-taken and successfully completed before the student will receive a grade.</p>
<p>If a student in good standing voluntarily withdraws after completing a current semester, or academic year, the student will retain the grade they have earned on his/her academic report and transcript. If a student in good standing withdraws in the middle of a quarter or a semester, any grades earned will be forfeit.</p>
<p>All voluntary withdrawals in good standing must follow admission procedures to rematriculate.</p>`},

{ id:"p34", t:"Withdrawal &amp; Incomplete", n:"34", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>WITHDRAWAL - DISCIPLINARY REASONS</h3>
<p>Any student who is forced to withdraw or voluntarily withdraws for disciplinary reasons will receive a Withdrawal Disciplinary (WD) on his/her academic report and transcript. The student will receive a grade of zero (0) for the courses in which he/she was enrolled at the time of the withdrawal. Furthermore, if the student is readmitted at a later date, these courses must be retaken successfully before the student will be permitted to matriculate or graduate. In addition to the aforementioned, the student&rsquo;s user login for Populi will be removed and all identification granting access to The River at Tampa Bay Church campus will be collected. Please see page 21 for financial responsibility.</p>
<p>Reasons for disciplinary withdrawal include, but are not limited to:</p>
<ul>
<li>Violation of Student Code of Conduct</li>
<li>Failure to adhere to college policies and procedures</li>
<li>Failure to adhere to the moral standards set forth by RU</li>
<li>Excessive Absences</li>
</ul>
<p>The Dean or his appointed representatives will handle any discipline problems that may arise. Any student who is found to be acting in a manner that brings discredit to the Kingdom of God and/or RU will be disciplined, even to the extent of suspension or expulsion from school. RU reserves the right to revoke any such student&rsquo;s degree. Dean permission will be required to rematriculate and all admission requirements must be met.</p>
<h3>INCOMPLETE</h3>
<p>An Incomplete (I) is given when a student has completed the majority of the course work in a given course but is unable, due to extenuating circumstances, to complete the course. An Incomplete is not a final grade. It will provide the student with an opportunity to delay the grading process until he/she can complete all coursework and submit it to the instructor for a final grade.</p>
<p>In order to receive an Incomplete (I), the student must submit a written notice of intent to the Administration Office. The student must then obtain all course assignments that are to be completed from the instructor. The amount of time allotted for completion of the coursework will be determined by the instructor. The standard length of time determined by the school is no more than one quarter.</p>
<p>The student will receive an (I) on the academic report until the course work is completed. If all required course work is completed and returned to the instructor within the allotted time, the instructor will update the grade. The grade of (I) will be removed, and the final grade will be recorded on the student&rsquo;s grade report and transcript. However, if all required coursework is not completed within the allotted time, the (I) will be changed to an (F) and will be recorded as Failing.</p>`},

{ id:"p35", t:"Testing, Grades &amp; Transcripts", n:"35", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>COURSE TESTING</h3>
<p>Exams are prepared by the course instructor. Exam dates are noted on the Academic Calendar and are subject to change. Please view each course syllabus for other testing information. Exams are administered online via Populi. Students are required to take their exams on their own electronic device outside of class time.</p>
<p>Each exam is 60 minutes and several days are given to ensure students have sufficient time to complete all tests for each class they are enrolled in. There are no retakes or makeup exams. If you do not take the exam during the availability set for your test, you will not be allowed to take it at another time. No exceptions.</p>
<p>Reasonable accommodations are provided to English Language Learners and reported varying exceptionalities. Please email <a href="mailto:RUadmin@revival.com">RUadmin@revival.com</a> to determine if accommodations are required.</p>
<p>Please remember you are on an honor system. This means no notes, no books, and only you are to take your exam.</p>
<h3>STUDENT GRADE REPORTS</h3>
<p>Students may access their grades through Populi. Once the quarter ends, please allow two weeks for the submission of final grades as grading information must be received from all instructors. Grade reports may be printed from Populi if students need a written record.</p>
<h3>GRADE DISCREPANCY</h3>
<p>A Grade Discrepancy Form is available within a scheduled period of time if a student believes there is an error in grading for assignments, exams, labs, or practicums. This form must be accompanied with supporting documentation for each grade occurrence. Discrepancies will only be considered during the quarter the students&rsquo; exams were taken and must be submitted by the term due date. Once grades are locked they cannot be reopened for any changes.</p>
<h3>STUDENT TRANSCRIPTS</h3>
<p>Student transcripts are secured in the school office. Students desiring an official transcript must complete a transcript release form. The release form can be found at <a href="https://www.RiverUniversity.org" target="_blank" rel="noopener">www.RiverUniversity.org</a> under the Academics tab and in your Populi student profile. Transcripts are only issued to students whose financial account is in satisfactory condition. Each official transcript release is $10.00. Please allow 30 days for the processing of transcript requests. Official transcripts may be expedited at the cost is $35 per transcript. Please allow seven business days for processing. Unofficial transcripts are free and can be accessed from your Populi student profile.</p>
<p>In accordance with federal law, records cannot be released without the written consent of the student.</p>
<table class="codes">
<tr><td>AUD</td><td>Audit</td></tr>
<tr><td>I</td><td>Incomplete</td></tr>
<tr><td>IP</td><td>In Progress</td></tr>
<tr><td>R</td><td>Retake</td></tr>
<tr><td>W</td><td>Withdraw</td></tr>
<tr><td>WD</td><td>Withdraw Disciplinary</td></tr>
<tr><td>TC</td><td>Transfer Credit</td></tr>
</table>`},

{ id:"p36", t:"Academic Integrity", n:"36", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>ACADEMIC INTEGRITY</h3>
<p>Academic integrity means honesty and responsibility pertaining to assignments and exams. Assignments and exams are administered to determine growth and understanding in the student&rsquo;s learning experience. Grades exist in order to show how fully this goal is attained. Therefore all work and grades should result from the student&rsquo;s own study, understanding, work, and effort.</p>
<h3>SUBMITTING THE SAME ASSIGNMENT</h3>
<p>Submitting the same assignment for more than one class violates the assumption that each assignment&rsquo;s purpose is to further the student&rsquo;s learning and growth. Unless the second instructor provides permission in writing, submitting the same assignment for different classes is considered a form of academic misconduct. Students attending as married couples may not turn in the same assignments. Each assignment must be completed individually.</p>
<h3>PLAGIARISM</h3>
<p>Plagiarism is not tolerated at RU. Plagiarism is the act of stealing and using another person&rsquo;s words or ideas as one&rsquo;s own, without giving the source credit- it is theft. All assignments are required to be the original work of the student.</p>
<p>Plagiarism carries heavy disciplinary and academic penalties and could result in suspension from the college. Students suspended for plagiarism will not have an appeal and will not appear before a Discipline Committee.</p>
<p><b>Avoiding Plagiarism:</b></p>
<ol>
<li>Students who quote themselves from a previous writing must cite the quotation in the current assignment.</li>
<li>Properly cite all research. Use proper documentation for direct quotations, as well as information restated (paraphrased) in your own words. Use quotation marks for exact words. Only general knowledge should not be cited.</li>
<li>The student who affixes his or her name to a paper must be the sole author of the paper. Students may consult with the teacher at any point in composing a paper. A typist, friend, or spouse may not ghostwrite or correct the paper.</li>
</ol>
<p><b>HELPFUL WEBSITES:</b></p>
<ul>
<li><a href="https://owl.english.purdue.edu/owl/" target="_blank" rel="noopener">www.owl.english.purdue.edu/owl/</a></li>
<li><a href="https://www.CitationMachine.net" target="_blank" rel="noopener">www.CitationMachine.net</a></li>
<li><a href="https://www.Grammarly.com" target="_blank" rel="noopener">www.Grammarly.com</a> (This is a Plagiarism Checker)</li>
</ul>`},

{ id:"p37", t:"Plagiarism Protocol", n:"37", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>PLAGIARISM PROTOCOL</h3>
<ol>
<li>The teacher identifies a possible plagiarism case and then confirms the finding with another faculty member.</li>
<li>The teacher will contact the Dean, and it will be determined if a meeting is necessary with the teacher, Dean, and the student.</li>
<li>If plagiarism is confirmed, the following consequences will be assessed:
  <ol class="alpha">
  <li>The student will receive a &ldquo;zero&rdquo; for the assignment, and the Dean will note this in the student&rsquo;s file.</li>
  <li>If the severity of plagiarism qualifies as flagrant dishonesty (an assignment that measures 20% or more of non-cited work per paper), the student will be suspended from school.</li>
  <li>Any student who repeats plagiarism at any time during their enrollment in RU will be suspended from school immediately.</li>
  </ol>
</li>
</ol>
<h3>ATTRIBUTION ERRORS</h3>
<p>Papers that have more than two sentence length attribution errors will receive a zero. This severe penalty reflects the moral disgrace of the offense. Attribution errors comprise these wrong practices:</p>
<p><b>Plagiarism:</b> presenting someone else&rsquo;s work as one&rsquo;s own or presenting someone else&rsquo;s work without proper credit.</p>
<p><b>Misrepresentation:</b> inaccurately presenting words or ideas from a source. The following are typical attribution errors:</p>
<ul>
<li>Failure to use quotation marks for exact words (with or without citation)</li>
<li>Failure to cite the words or ideas of a source</li>
<li>Failure to paraphrase correctly (mixing source and student words without quotation marks around the source&rsquo;s words)</li>
<li>Failure to give the correct location of a source (wrong source or wrong page number)</li>
</ul>`},

{ id:"p38", t:"Cheating", n:"38", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>CHEATING</h3>
<p>Cheating is not tolerated at RU. Cheating is copying another&rsquo;s work and claiming it as your own original work, whether it is on a homework assignment, quiz, test, exam, or project. Group work is designated as such by faculty.</p>
<p>All examinations and assignments are to be completed without any outside help given or received from other students or alumni in any form unless otherwise instructed by the teacher. This includes, but is not limited to: cheat sheets, books, notes, cell phones, computers, iPods, iPads, etc.</p>
<p>Signing another person&rsquo;s name or affixing another person&rsquo;s name to a sign-in sheet or other document is considered instances of cheating.</p>
<p>Cheating carries heavy disciplinary and academic penalties and could result in suspension from school. Students suspended for cheating will not have an appeal and will not appear before the Discipline Committee.</p>
<h3>CHEATING PROTOCOL</h3>
<ol>
<li>After identifying a case of cheating, the teacher will contact the Dean, and it will be determined if a meeting is necessary with the teacher, Dean, and the student.</li>
<li>If cheating is confirmed, the following consequences will be assessed:
  <ol class="alpha">
  <li>The student will receive a &ldquo;zero&rdquo; for the assignment, and the Dean will note this in the student&rsquo;s file. The student will not be allowed to retake the exam.</li>
  <li>A student who cheats may be suspended from the college or placed on disciplinary probation.</li>
  <li>Any student who repeats cheating at any time during their enrollment in RU will be suspended from the school immediately.</li>
  </ol>
</li>
</ol>
<p><b>Note:</b> Students who cheat or plagiarize will be dealt with on the basis of their actions. The student&rsquo;s reputation and prior incidents will be taken into consideration, as well as their response to the situation at hand. Any combination of cheating and plagiarism will be considered two incidents and a suspension offense.</p>`},

{ id:"p39", t:"Graduation Requirements", n:"39", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>GRADUATION REQUIREMENTS</h3>
<p>Graduation is a joyous time for students of RU. During graduation, students are recognized and rewarded for their diligence, time, and dedication to their respective courses of study.</p>
<p>Although graduation is an exciting time, it can also be quite hectic. In an effort to eliminate unnecessary confusion, anxiety, and disappointment during the time surrounding graduation, please take note of the listed general graduation requirements below:</p>
<ul>
<li>Each student must successfully meet all course requirements, including the required credit hours of study, for the program in which he/she is enrolled</li>
<li>Each student must have a cumulative grade point average (GPA) of 2.00 for first year, 2.80 for 2nd and 3rd year and 3.00 for the 4th year.</li>
<li>Each student must maintain satisfactory attendance as outlined in this catalog and must meet all requirements outlined in the course syllabus</li>
<li>Each student must settle all financial obligations with RU</li>
<li>Each student must meet their quarterly Soul Goal as outlined in the Soul Winning I and II courses&rsquo; syllabi, and Soul Winning Lab syllabus</li>
<li>Each student must display moral and professional character during their entire enrollment period.</li>
<li>Attend annual banquet after completing a full academic year</li>
<li>Attend graduation commencement rehearsals and ceremony</li>
</ul>
<p>Graduation is held once per academic year at the conclusion of the fourth quarter. RU Year Three students who are eligible for graduation and who have met all graduation requirements may participate in the graduation commencement exercises which are held at The River at Tampa Bay Church. Graduation rehearsal and commencement ceremony attendance is required for all students.</p>
<p>The responsibility for understanding and meeting graduation requirements rests entirely with the student. School Administration reserves the right to deny any student participation in graduation exercises, if deemed necessary.</p>`},

{ id:"p40", t:"Honors and Awards", n:"40", h:`
<h2 class="ph">ACADEMIC INFORMATION</h2>
<h3>HONORS AND AWARDS</h3>
<p>RU strongly believes in rewarding students for their scholastic achievement. The Honors and Awards program affords RU the opportunity to give recognition to those individuals who have, by the help of God, excelled in their achievements. These students have not settled for mediocrity and have established themselves as leaders in academic excellence and outstanding moral character. A student with a grade of &ldquo;D&rdquo; or &ldquo;F&rdquo; on their transcript is ineligible to participate in the Honors and Awards program even though the GPA requirement is met. The following honors may be awarded to RU B.A. and M.A. graduates achieving these standards throughout their tenure:</p>
<p><b>Valedictorian</b> &ndash; The student graduating with honors who has the highest overall GPA of his/her graduating class and exemplified outstanding leadership and excellent moral character.</p>
<p><b>Presidential Scholar</b> &ndash; The student who has maintained a 4.0 GPA for each quarter he/she has enrolled.</p>
<p><b>Summa Cum Laude</b> &ndash; The student graduating with honors who has an overall GPA of 3.90-4.00</p>
<p><b>Magna Cum Laude</b> &ndash; The student graduating with honors who has an overall GPA of 3.80-3.89</p>
<p><b>Cum Laude</b> &ndash; The student graduating with honors who has an overall GPA of 3.70-3.79</p>
<h3>GRADUATES OF RU</h3>
<p>Students that have earned a degree and have graduated from the school are expected to uphold high Christian standards that a RU degree represents. Therefore, RU reserves the right to revoke any and all degrees earned from any graduate that does not remain in compliance with the RU&rsquo;s statement of faith or whose life and/or ministry brings reproach upon the body of Christ.</p>
<p class="note"><b>PLEASE NOTE:</b> The Valedictorian will only be selected from the B.A. graduates.</p>
<p class="note"><b>PLEASE NOTE:</b> M.A. graduates will have their honors noted on their transcript but not on their regalia jackets.</p>
<p class="note"><b>PLEASE NOTE:</b> If a graduate requests a reprint of an earned diploma, a RU Statement of Faith Survey will be included to ensure that the expected standards are upheld and offer reasonable assistance if there are conflicts.</p>
<h3>ADMINISTRATIVE CHANGES</h3>
<p>RU reserves the right to make any changes deemed necessary for the betterment of the college and the further achievement of the institutional goals and objectives.</p>
<p>Please contact RU&rsquo;s Administrative Office at 813-849-6641 during regular business hours if you have a question that needs to be addressed.</p>`},
{ id:"p41", t:"Student Expectations", n:"41", h:`
<h2 class="ph">STUDENT INFORMATION</h2>
<h3>STUDENT EXPECTATIONS</h3>
<p>One of the most important aspects of this school is the student. The development of RU, the implementation of each program, and the selection of curriculum are all developed to produce a student who is confident and proficient in their walk with God. Therefore, students who are matriculated at RU are expected to abide and uphold all the rules and regulations set forth during their full tenure while at RU.</p>
<p>Students of RU are encouraged and fully expected to:</p>
<ul>
<li>Develop and nurture a continued spiritual relationship with God through daily Bible study, continual prayer, and fasting (James 4:8; Matthew 6:5-18)</li>
<li>Cultivate submissiveness to God and a willingness to be obedient to the Holy Spirit (James 4:7)</li>
<li>Acknowledge and act on their authority over spiritual wickedness (Luke 10:19)</li>
<li>Verbally confess the Word of God on a continual basis (Deuteronomy 17:18-20; Joshua 1:8)</li>
<li>Maintain physical well-being by viewing their bodies as temples of God (1 Corinthians 6:18-20)</li>
<li>Abstain from the use, endorsement, or propagation of illegal drugs and activities, immoral behavior, illicit sexual acts, homosexual behavior, pornography, vaping or e-cigarettes, marijuana in any form, and the use of tobacco or alcoholic beverages (Galatians 5; 1 Corinthians 6-7, Revelation 21:8, 22:15; Ephesians 5:18, Proverbs 20:1; 23:20; Isaiah 5:22; Exodus 20)</li>
<li>Understand and interpret the Bible to be equipped with the knowledge of God and overcome adversity and live a life of victory (2 Tim 2:15)</li>
<li>Develop mental and spiritual discipline (1 Peter 4:7-8)</li>
<li>Practice the &quot;Love Walk&quot; and live peaceably with others (Romans 12:18, 1 John 1:7-11)</li>
<li>Seek God and desire the things of God (Matthew 6:33)</li>
<li>Walk in the power and authority of Jesus (Luke 10:19)</li>
<li>Cultivate the gift of God which is in them and to be sensitive to the Holy Spirit (1 Peter 4:10; Romans 8:14)</li>
</ul>
<h3>STUDENT HONOR CODE</h3>
<p>RU is a Christian school which teaches a lifestyle of personal commitment to Jesus Christ as an essential component to evangelistic outreach. The student must recognize this purpose and endeavor to exemplify an attitude of excellence and maintain the highest level of respect for the aim and purpose of the school.</p>`},

{ id:"p42", t:"Student Conduct", n:"42", h:`
<h2 class="ph">STUDENT INFORMATION</h2>
<h3>STUDENT CONDUCT</h3>
<p>RU works to provide a safe and positive atmosphere conducive to learning. Therefore, the following code of conduct must be observed at all times:</p>
<ol>
<li>All students enrolled at RU are representatives of this college and are expected to conduct themselves in a professional and respectful manner both on and off campus in all forms of communication. This includes communication via emails, social media, face-to-face, etc.</li>
<li>RU is a smoke free, drug free, and alcohol free environment, therefore all students must abstain from the use of cigarettes in any form, drugs, and alcohol in the building or anywhere on the grounds.</li>
<li>RU opposes open displays of affection with fellow students while on campus or at any school sponsored event.</li>
<li>Profanity, cheating, stealing, dishonesty, gambling, and destruction of property are not permitted.</li>
<li>Students must refrain from perverse, lewd or obscene conversation and behavior.</li>
<li>Students must refrain from passing on inaccurate information, tale-bearing, and backbiting.</li>
<li>Students&rsquo; attire is to be conservative; similar to the attire worn to work in an office setting.</li>
<li>All smart devices must be turned off during the class period, unless used for note taking. Messages can be checked during breaks. Students will be dismissed from their class if a cell phone goes off during the class period. Repeat offenses will result in probation, suspension, or other administrative action.</li>
<li>Acts of hazing and blatant violations of students&rsquo; personal being and/or property are expressly forbidden and will result in the immediate dismissal from school. Criminal charges will be filed.</li>
</ol>
<h3>STUDENT GATHERINGS</h3>
<p>Outside of RU and The River at Tampa Bay church activities, no student gatherings will be recognized as an official RU event without prior permission from the Dean of RU.</p>
<h4>Homes</h4>
<p>No persons of the opposite sex (student or otherwise) are permitted to be within the homes of any student at any time. Students are not permitted to be in the homes of those of the opposite sex who are not students.</p>
<h4>Group Gatherings</h4>
<p>Group gatherings in public places are permitted on a case-by-case basis, which requires written request for permission from the Dean, no later than 3 weekdays prior to the event. Accountability for any questionable activities during a student gathering will be the responsibility of the host for the event.</p>
<h4>Vehicles</h4>
<p>No two persons of the opposite sex are to be alone together in the same vehicle. Exceptions are granted for family members.</p>`},

{ id:"p43", t:"Dating, Marriage &amp; Ministering", n:"43", h:`
<h2 class="ph">STUDENT INFORMATION</h2>
<h3>STUDENT DATING</h3>
<p>While we realize that RU is fertile ground for those desiring a mate, there are particular guidelines which must be observed. Public displays of affection (PDA) such as kissing, hugging/holding, caressing, massaging backs, and so forth are not considered appropriate on-campus or church service behavior.</p>
<p>Students of RU are not permitted to date/court anyone, or develop a close/intimate friendship with members of the opposite sex during the first and second academic years and must never engage inappropriate relationships with members of the same sex (1 Corinthians 7:32-35). We ask for you to abide by these rules because of the extreme distraction these relationships create. Exceptions will NOT be considered, so please don&rsquo;t ask! Group dating and get-togethers with the opposite sex are viewed in the same manner.</p>
<p><b>Any 3rd-year B.A. or M.A. student who is considering dating during the course of their tenure at school, must meet with the Dean of RU prior to making any arrangements. Anything to the contrary will result in immediate dismissal - no exceptions.</b></p>
<h3>STUDENT MARRIAGE</h3>
<p>Student biblical marriage will only be considered if both parties are either third and/or fourth year students or fully graduated - period.</p>
<p>We do consider it extremely unwise to marry an individual based on a brief courtship, and strongly recommend that anyone considering marriage go through extensive premarital counseling prior to getting engaged.</p>
<p>Further, RU strongly urges students to stay focused on why they came to RU in the first place - to be trained. If anything like dating or marriage comes into the picture - as it has in the past - it has proven to be extremely distracting. You came here to receive ministerial training. If anything else is competing for your attention, you will not be able to get everything you are going to need out of your time here. The last thing anyone needs is to become side-tracked and then lost to Gospel Ministry. If you cannot or will not accept this rule, then you will be forfeiting your scholarship. We would rather lose you now, at enrollment, than later, at graduation.</p>
<p>While the school does not seek to control any person&rsquo;s life, we do sense an obligation to warn students that brief courtships and impulsive marriages have historically resulted in a much higher percentage of serious marital difficulties and a higher rate of divorce. Even in cases where individuals insisted, &ldquo;God was leading them to get married quickly.&rdquo;</p>
<p>Further, this school believes that if an individual chooses to be impulsive and careless regarding something as sacred and significant as one&rsquo;s choice of a marriage partner, and disregards sound counsel and conventional wisdom on this matter, then that individual is demonstrating a lack of patience, steadfastness and the character that is necessary for his or her later success in ministry.</p>
<h3>MINISTERING WHILE AT RU</h3>
<p>While you are matriculated at RU, you are not permitted to minister. By &ldquo;minister&rdquo; we mean to conduct services as an evangelist, teacher, worship leader, guest speaker, singer, instrumentalist, or other such ways including social media. Students are not allowed to minister at or attend other ministries during class hours and required events and services. Attending missionary trips are viewed in the same manner. Also, students are not permitted to pray for, lay hands on, or prophesy over any person. Ministering is to be done by the pastors on staff and approved leadership.</p>`},

{ id:"p44", t:"Student ID Cards", n:"44", h:`
<h2 class="ph">STUDENT INFORMATION</h2>
<h3>STUDENT ID CARDS</h3>
<p>Every student is given a student identification card bearing their legal name and student number.</p>
<ol>
<li>The ID card must be worn on a lanyard clearly visible around your neck at all times during class hours, while on the property and in services. Borrowing or lending out an ID card to anyone is prohibited.</li>
<li>If you find a lost ID card, return it to the Administration Office promptly.</li>
<li>Nothing is to be taped, pinned, stapled, or attached to your ID in any way. This includes taping of photos on it or defacing it in anyway.</li>
<li>Any correspondence to the Dean or the Administration Office MUST have a Student Identification number on it which is located on your student ID.</li>
<li>You may not attend class or church services without your ID for any reason. If you do not have your ID badge during a church service, you will be sent to the Welcome Tent (Registration) to acquire a wristband.</li>
<li>Students who misplace their ID may secure a temporary badge from Student Services until their ID badge is found, or a replacement ID badge has been issued.</li>
<li>If a student forgets their ID badge, there are two options:
  <ol class="alpha">
  <li>The student may leave the campus, locate the ID, and return to school. (Any classes missed will be marked absent.)</li>
  <li>The student may see an Attendance Representative and rent a temporary ID (good for that day only) for a $10 fee. *Note: Any student who has misplaced an ID badge may rent a temporary badge for up to two consecutive days. At that time, the student must be issued a replacement badge (at no additional charge as the $20 fee has already been accrued).</li>
  </ol>
</li>
<li>In the case of a lost badge, a replacement badge may be purchased for a $20 fee.</li>
<li>All ID cards and parking passes must be returned to the school Administrative Office if withdrawn or expelled. If not returned, a fee will be incurred as listed on the Financial Information page.</li>
<li>All ID cards and parking passes must be returned to the school Administrative Office at the end of each academic year. If not returned, a fee will be incurred as listed on the Financial Information page.</li>
</ol>`},

{ id:"p45", t:"Student Dress Code", n:"45", h:`
<h2 class="ph">STUDENT INFORMATION</h2>
<h3>STUDENT DRESS CODE</h3>
<p>The purpose of RU is to not only strengthen the student&rsquo;s Christian walk, but also to prepare the student for ministry. With this in mind, professionalism in dress and conduct is imperative. It is the desire of this school that all of the students be dressed modestly and in good taste (1 Tim. 2:9-10; Deut. 22:5; 1 Pet. 3:3-5). The dress code outlined below applies at all times when attending classes, during school hours, and during church services, including off campus activities.</p>
<p class="note"><b>Note:</b> Any student in violation of the dress code, will be asked to change into acceptable attire or to leave the campus. The student will be counted absent for any classes missed that day.</p>
<p>The Dean, any faculty member, school staff member, or Dress Code Monitor is authorized to speak to any student out of dress code. If there is a question about any aspect of dress code, the Dean&rsquo;s word is final. We reserve the right to amend the dress code during the year if necessary.</p>
<p class="note"><b>Note:</b><br>
When serving in the Unite program for your ministry of helps (MOH) assignment, please check with your department supervisor regarding dress code. Students are allowed to dress according to each MOH assignment during that service. For all other services every student must be in school dress code. No exceptions.</p>
<p>During outside services students are permitted to dress in the &ldquo;Casual Dress Code.&rdquo;</p>
<h3>DRESS CODE VIOLATIONS</h3>
<p>Students found in violation of the dress code, as stated above, will be sent home to change. Below are the procedures for dress code violations in addition to being sent home to change clothes and being marked absent for the entire day.</p>
<ul>
<li><b>1st Violation</b> &ndash; Written warning with the possibility of being sent home to change.</li>
<li><b>2nd Violation</b> &ndash; Written warning signed by the student and sent home to change.</li>
<li><b>3rd Violation</b> &ndash; Written warning signed by the student, sent home to change, and meeting with the Advisor.</li>
<li><b>4th Violation</b> &ndash; Disciplinary meeting with RU Administration and potential indoor suspension.</li>
</ul>
<h3>TATTOOS:</h3>
<p>Students at RU are prohibited from obtaining any tattoos throughout their tenure, including the summer months. (Lev. 19:28)</p>`},

{ id:"p46", t:"Dress Code &mdash; Women", n:"46", h:`
<h2 class="ph">STUDENT INFORMATION</h2>
<h3>BUSINESS CASUAL DRESS CODE FOR CLASS TIME</h3>
<h4>WOMEN &ndash; Acceptable Attire</h4>
<p>Acceptable attire includes dresses, blouses, skirts, collared shirts, suits, blazers/jackets, sweaters, and turtlenecks with dress slacks that are modestly fitting.</p>
<p><b>Blouses:</b></p>
<ul>
<li>All blouses and sweaters must have capped sleeves, cover cleavage, back, stomach and midriff area entirely at all times, even when arms are raised. No pullover hoodies.</li>
</ul>
<p><b>Pants</b></p>
<ul>
<li>Slacks (buttoned with zipper) must cover the hip, preferably worn at the waist and fit modestly. A pair of slacks, has either no pockets in the back or the back pocket is made of lining. This means that if your pants have outside pockets, they are not slacks. (No denim/jean, distressed, weathered or spandex material, no rompers, no overalls)</li>
</ul>
<p><b>Dresses/Skirts</b></p>
<ul>
<li>Dress and skirt length must be below the knee or longer and fit modestly including when wearing tights or leggings. Hemline of skirts should be below the knee or longer, front and back.</li>
<li>Any slit on the front of a skirt or dress may not rise above the knee. Any slit on the side or back may not exceed 3-4 inches above the knee.</li>
</ul>
<p><b>Shoes</b></p>
<ul>
<li>Dressy strap sandals (straps around the back of the heel)</li>
<li>Dressy mules</li>
<li>Dress shoes (heals or flats)</li>
<li>Boots (no combat boots)</li>
</ul>
<p><b>General Appearance</b></p>
<ul>
<li>All students are expected to observe good hygiene and wear clean clothing</li>
<li>No advertisements, excessive designs, wording, or logos on them</li>
<li>At no time should underwear be visible including when you bend over</li>
<li>Undergarments should not be visible through your clothing. All sheer or transparent garments must be paired with a non-transparent garment underneath that fully covers the upper torso. (e.g. shells, tank tops, undershirts, etc.)</li>
<li>Undergarments should be supportive and not show any details of the anatomy</li>
<li>If wearing open-toe shoes, please have well-groomed feet and toenails</li>
<li>Hair must be clean, neatly groomed and well kept (professional style and natural coloring and highlighting are acceptable)</li>
<li>Earrings are permitted (no body piercing, gauges, ear piercing retainer)</li>
<li>Jewelry may be worn in moderation</li>
</ul>`},

{ id:"p47", t:"Dress Code &mdash; Men", n:"47", h:`

<p>Acceptable attire includes buttoned collared shirts, oxfords, Polo's, or buttoned collared short-sleeve shirts may be worn with dress slacks. All clothing is to be pressed and neat without stains, holes, tears, or ragged edges on clothing.</p>
<p><b>Shirts:</b></p>

<li>No pullover hoodies</li>
</ul>
<p><b>Pants:</b></p>
<ul>

<li>Pant hem must reach your ankles</li>
</ul>
<p><b>Shoes:</b></p>

</ul>

<li>Earrings are not permitted (no body piercing, gauges, ear piercing retainer)</li>

<li>Hats are not permitted inside</li>
</ul>`},

{ id:"p48", t:"Casual Dress Code", n:"48", h:`

{ id:"p49", t:"Disciplinary Procedures", n:"49", h:`
<h2 class="ph">STUDENT INFORMATION</h2>
<h3>DISCIPLINARY PROCEDURES</h3>
<p>Students are strongly encouraged to familiarize themselves with this student handbook which contains guidelines relating to student conduct, student dress, and the expectations for proper conduct. If a student willfully and repeatedly disobeys the rules and regulations of RU, one of the following actions will be taken:</p>
<h4>Disciplinary Warning:</h4>
<p>The student will be warned of the offense and directed to the student handbook for further reinforcement. The date and nature of the infraction will be recorded in the students&rsquo; Populi profile. No further action will be taken.</p>
<h4>Disciplinary Probation</h4>
<p>The student will be counseled by an Academic Advisor who will ensure that the student is aware of the offense and its consequences as it relates to the student&rsquo;s continued enrollment in the university. The student will receive a written warning. Corrective instruction will be provided. Documentation of the offense and a copy of the written warning will be placed in the student&rsquo;s permanent file and Populi profile.</p>
<h4>Disciplinary Suspension or Expulsion</h4>
<p>The student will meet with the Dean of RU and an Academic Advisor, who will again ensure that the student is aware of the offense brought against him/her and its consequences. The Dean will provide counsel and instruction. The student will be suspended or expelled.</p>
<p>If suspended, the length of the suspension will be determined by the Dean. Once the length of suspension is determined, the student will be notified. The student will not be permitted to make-up any work assigned, take any test given during the period of suspension or be excused from class and lab attendance. Since the course assignments may not be completed while the student is suspended from classes, the student may be in serious jeopardy of failing the course.</p>
<p>If expelled, the student will not be allowed on campus, the student&rsquo;s user login for Populi will be removed and all identification granting access to The River at Tampa Bay Church campus will be collected. Expulsions will consist of the revocation of all earned degrees.</p>
<p>The counsel of the President of the college may be sought depending on the severity of the offense.</p>
<h3>READMISSION AFTER A PERIOD OF SUSPENSION</h3>
<p>At the completion of the suspension period, the student will again meet with the Dean of RU. If the behavior has been corrected, the student will be permitted to return to class. If the behavior has not been corrected, the student will be asked to withdraw from the college.</p>`},

{ id:"p50", t:"Dismissal, Appeals &amp; Housing", n:"50", h:`
<h2 class="ph">STUDENT INFORMATION</h2>
<h3>DISMISSAL</h3>
<p>RU reserves the right to dismiss a student from their enrolled program or from classes at any time if the student&rsquo;s conduct or academic standing is regarded as unsatisfactory, undesirable, not conducive to a productive learning environment, or violates the Code of Conduct for this institution.</p>
<p>It is understood and agreed upon by the signature on the student application that the college or any of its officers or faculty shall not be held liable in any way for such a dismissal or expulsion. Expulsions will consist of the revocation of all earned degrees.</p>
<h3>STUDENT APPEALS POLICY</h3>
<p>If a student does not agree with the decision handed down by RU administration relating to disciplinary action, the student may voice his/her concern or grievance in writing to the President of the college. The college President, who is also the senior pastor, will review the information and make a final ruling. The student will be notified in writing as to the results of the appeal.</p>
<h3>DISPUTE RESOLUTION</h3>
<p>All students/graduates agree that any dispute arising out of this Handbook will be handled in complete compliance with the directions and principles outlined in Matthew 18 and other scriptures deemed relevant by Drs. Rodney and Adonica Howard-Browne as the leadership of this ministry. The only legal jurisdiction regarding this agreement will be found in the Word of God, as the Word of God shall be the supreme authority governing every aspect of this dispute-resolution process. The law of any nation, state, country, providence, union, or any other governing body will be invalid and inapplicable in this dispute resolution process. The decisions of Drs. Rodney and Adonica Howard-Browne and the leadership of RU will be final and binding in all matters of dispute resolution arising from the terms of this agreement.</p>
<h3>STUDENT HOUSING</h3>
<p>RU is a commuter college and does not offer student housing at this time.</p>
<p>RU or the River at Tampa Bay Church does not assume responsibility for any information given between private homeowners and students leasing or rental agreements. RU and/or The River at Tampa Bay Church are not liable to retain monies owed or to resolve any housing issues that may arise between a tenant and private homeowner. Any rental agreements made between any private homeowners and students will be solely between the owner and the tenant. Under no circumstances can RU or The River at Tampa Bay Church be contacted to collect any information on behalf of the participant.</p>
<p class="note"><b>PLEASE NOTE:</b> Co-ed housing is not permitted.</p>
<h3>STUDENT RECORDS</h3>
<p>Student records are kept in the Administrative Office. Through cooperative use of computer automation and manual recordkeeping, there is quick access to student records.</p>
<p>To ensure that every student is kept abreast of all matters pertaining to the school, it is imperative that each student notify the Administrative Office of any changes in your home address, email, and telephone number. It may be necessary to contact students during regular workday to advise of schedule changes; therefore, the student should also provide the school with a current work or cell phone number or other means of contact during the day time.</p>
<p>In accordance with federal law, records cannot be released without the written consent of the student.</p>`},

{ id:"p51", t:"Privacy &amp; Contact Information", n:"51", h:`
<h2 class="ph">STUDENT INFORMATION</h2>
<h3>STUDENT CONTACT INFORMATION</h3>
<p>It is very important that there is current information on all students. Students must provide and use their legal names listed on their official identification and an address &ndash; resident and/or P.O. Box, phone number &ndash; home and/or cell, email address, roommates&rsquo; names, if any, including the name of their landlord/lady if it is a person who attends The River Church at Tampa Bay. Please update Populi when any of your information changes.</p>
<p class="note"><b>PLEASE NOTE:</b> RU does not accept any other names than what is listed on official ID. Only legal names are allowed to be used at RU and printed on diplomas.</p>
<h3>STUDENT PRIVACY</h3>
<p>To assure the privacy of every student, the school will not disclose information about a student to anyone but the student and/or legal guardian. No grades will be discussed by phone. No student will be allowed to view another student&rsquo;s file. A student may view his/her own file in the presence of an office employee such as the Dean of RU, the Administrator, or a member of the office staff. Students may not be allowed to view the reference pages.</p>
<p>In accordance with federal law, records cannot be released without the written consent of the student.</p>
<p>On occasion, an instructor may need to contact a student with questions relating to a course. In this case, the instructor will be given the student&rsquo;s phone number.</p>
<p>Only a dean approved house visit by two appointed RU leaders are allowed to visit a student&rsquo;s home concerning matters relating to school.</p>
<h3>INSTRUCTOR PRIVACY</h3>
<p>To assure the privacy of RU instructors, the school will not disclose personal information about an instructor. If a student needs to contact an instructor, please follow the proper protocol set in place as discussed during Orientation. No student is to call or text an instructor on their personal phone, direct message on any messaging platform, approach their vehicle or visit an instructor at his/her home concerning matters relating to school.</p>
<h3>COLLEGE RELATED FORMS, DOCUMENTS, AND ASSIGNMENTS</h3>
<p>College related forms, documents and assignments are generally returned in class or kept in the Administrative Office when returned by the instructor. Any forms, class documents or assignments sent to the college by mail are generally dispersed from the school Administrative Office. Any of these not picked up by the end of the school year will be disposed of.</p>
<h3>EMPLOYMENT OF STUDENTS</h3>
<p>There are presently no part-time or full-time employment opportunities available for students through RU.</p>`},

{ id:"p52", t:"Classroom/Campus Regulations", n:"52", h:`
<h2 class="ph">CLASSROOM/CAMPUS REGULATIONS</h2>
<h3>ANNOUNCEMENTS</h3>
<p>No one is allowed to make announcements in the classrooms except the Howard-Browne Pastors, the Dean, instructors, the Administrative Office staff or a person designated by them.</p>
<h3>AUDIO-EQUIPMENT</h3>
<p>Students are not permitted to touch any audio/video equipment. This includes microphones, cameras, television sets, sound booth, etc. If there is a sound problem, students are not allowed to attempt to correct the problem. There are people trained within the student body to handle the situation. If no one is available, please contact the classroom point person or the administrative office.</p>
<h3>CELLULAR PHONES</h3>
<p>Phones must be turned off upon entering the classroom and students are not to receive phone calls during class time. Cell phones may only be used during class for note taking. Only in extreme emergencies will a student be allowed to keep their phone on silent ring. Only the Dean or Administrator can give permission for your phone to be kept on. Students will be dismissed from their class if a cell phone goes off during the class period.</p>
<h3>CHILDCARE</h3>
<p>Minors are not permitted in the classroom in order to maintain the integrity of the material being taught and for the respect of our instructors and students. Also, children are not allowed on property unattended while parents are in class and labs. If you are homeschooling, it is your responsibility to find proper childcare.</p>
<h3>CLASS NOTES</h3>
<p>Each student is responsible for taking his/her own notes. Class notes are not to be sold to any other students, but may be borrowed by students to copy for studying when classes are missed due to sickness or other absences for good causes. Violations of this policy will be grounds for dismissal from school. Students attending as married couples are responsible for taking their own notes.</p>
<h3>COMPUTING DEVICES:</h3>
<p>(Computing Devices include: gaming consoles, smart phones, iPod touches, netbooks, tablets, handheld computers &amp; laptops)</p>
<p>All students will receive RU Computing Guidelines and are required to sign the accompanying Computing Policy Agreement. The following rules are in addition to those detailed in the Computing Guidelines.</p>
<p>Power cords are not to be plugged into the classroom outlets. Devices must run on their own batteries. If this behavior is observed by staff at any time, the device in question will be removed from the building and returned to the student at the end of the school day.</p>
<p>RU is not responsible for the safety or security of computing devices brought by students. Bring your devices at your own risk.</p>
<p>No games are to be played during class time. No apps or social media are to be used during class time. Note taking is the only permissible use of devices in the classroom.</p>
<p>No audio or digital recording or broadcasting of class sessions is allowed.</p>`},

{ id:"p53", t:"Classroom/Campus Regulations", n:"53", h:`
<h2 class="ph">CLASSROOM/CAMPUS REGULATIONS</h2>
<h3>DISTRACTIONS</h3>
<p><i>Alarm Watches, Cellular Phones, Headphones, iPods, Hand-Held Video Games, MP3 Players, etc.</i></p>
<p>Students must refrain from using any of these items in the classrooms as they are very distracting. Students will refrain from distracting activities of any kind such as: popping gum, cutting nails, tapping pencils, putting feet on chairs, continual verbal comments, or harming others when getting &ldquo;touched&rdquo;, and other bothersome habits or actions.</p>
<h3>FLYERS/HANDBILLS/BUSINESS CARDS</h3>
<p>Neither students nor the public are allowed to distribute or place on vehicles any flyers, tracts, advertisements, coupons, or any other material of any kind to fellow students or employees. Please inform the Administrative Office immediately if you see any activity of this kind taking place.</p>
<h3>FIREARMS</h3>
<p>Firearms are strictly prohibited on campus at all times. This includes toy guns. Violations of this policy will be grounds for immediate dismissal from school.</p>
<h3>FOOD AND DRINKS</h3>
<p>Food is strictly prohibited in the classroom during class sessions. Finish consuming food before entering the room. Only bottled water in transparent container is permitted in the classroom.</p>
<h3>INSTRUMENTS</h3>
<p>Students are not allowed to touch instruments at any time outside RSW class or scheduled worship times. During scheduled worship times, only authorized students are to be touching instruments. Exceptions may be made by securing permission from the Worship Department or school Administration. The River Church at Tampa Bay / RU will not be held liable for any damage/loss to musical instruments, or equipment brought into classes or services by students.</p>
<h3>OFFERINGS</h3>
<p>No offerings or funds for any reason shall be collected on the school campus or social media. The only exception to this rule is the collection for the class gift by the student body for Christmas and Graduation. The dates of these collections and the personnel to collect will be designated and authorized by the Dean or Administrator.</p>
<h3>PHOTO/VIDEO RELEASE</h3>
<p>Students enrolled in RU or participating affiliate schools grants the school and our affiliates the right to use, reproduce, publish and display photographs taken of the students, grounds, or any related events without compensation or permission. Furthermore, any digital image submissions or photographs taken will become the property of RU and our affiliates.</p>`},

{ id:"p54", t:"Classroom/Campus Regulations", n:"54", h:`
<h2 class="ph">CLASSROOM/CAMPUS REGULATIONS</h2>
<h3>RECORDING DEVICES</h3>
<p>No tape recorders or other recording devices are allowed in classrooms at any time.</p>
<p>No pictures or videos taken while on The River at Tampa Bay Church property may be posted on the internet via social networks (i.e., Facebook, Instagram, YouTube, Snapchat, TikTok, etc.).</p>
